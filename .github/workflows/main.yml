name: SADEE X DIMA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully"

      - name: Find User Project
        shell: bash
        run: |
          set -e

          USER_DIR=$(find extracted -type f -path "*/user/pubspec.yaml" -exec dirname {} \; | head -n 1)

          if [ -z "$USER_DIR" ]; then
            echo "ERROR: user/pubspec.yaml not found"
            find extracted -name pubspec.yaml
            exit 1
          fi

          echo "USER_DIR=$USER_DIR" >> "$GITHUB_ENV"

      - name: Find Admin Project
        shell: bash
        run: |
          set -e

          ADMIN_DIR=$(find extracted -type f -path "*/admin/pubspec.yaml" -exec dirname {} \; | head -n 1)

          if [ -z "$ADMIN_DIR" ]; then
            echo "ERROR: admin/pubspec.yaml not found"
            find extracted -name pubspec.yaml
            exit 1
          fi

          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create User Project
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_user \
            user_build

      - name: Copy User Config
        run: |
          cp "$USER_DIR/pubspec.yaml" user_build/pubspec.yaml

          if [ -f "$USER_DIR/lib/config.dart" ]; then
            cp "$USER_DIR/lib/config.dart" user_build/lib/config.dart
          fi

      - name: Create Clean User Main
        shell: bash
        run: |
          cat > user_build/lib/main.dart <<'DART'
import 'package:flutter/material.dart';
import 'package:supabase_flutter/supabase_flutter.dart';
import 'package:url_launcher/url_launcher.dart';
import 'config.dart';

const Color background = Color(0xFF070A10);
const Color cardColor = Color(0xFF111722);
const Color accent = Color(0xFF00E5FF);

Future<void> main() async {
  WidgetsFlutterBinding.ensureInitialized();

  await Supabase.initialize(
    url: supabaseUrl,
    publishableKey: supabaseAnonKey,
  );

  runApp(const SadeeApp());
}

class SadeeApp extends StatelessWidget {
  const SadeeApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'SADEE X DIMA',
      theme: ThemeData(
        brightness: Brightness.dark,
        scaffoldBackgroundColor: background,
        colorScheme: ColorScheme.fromSeed(
          seedColor: accent,
          brightness: Brightness.dark,
        ),
        useMaterial3: true,
      ),
      home: const LoginPage(),
    );
  }
}

class LoginPage extends StatefulWidget {
  const LoginPage({super.key});

  @override
  State<LoginPage> createState() => _LoginPageState();
}

class _LoginPageState extends State<LoginPage> {
  final keyController = TextEditingController();
  bool loading = false;

  Future<void> login() async {
    final key = keyController.text.trim().toUpperCase();

    if (key.isEmpty) {
      showMessage('Enter your license key.');
      return;
    }

    setState(() {
      loading = true;
    });

    try {
      final result = await Supabase.instance.client
          .from('license_keys')
          .select()
          .eq('key_code', key)
          .maybeSingle();

      if (result == null) {
        showMessage('License key not found.');
        return;
      }

      final status =
          (result['status'] ?? 'UNUSED').toString().toUpperCase();

      if (status == 'PAUSED') {
        showMessage('License is paused.');
        return;
      }

      if (status == 'EXPIRED') {
        showMessage('License has expired.');
        return;
      }

      if (status == 'UNUSED') {
        final days = (result['duration_days'] as num).toInt();

        final expiry = days == -1
            ? null
            : DateTime.now()
                .toUtc()
                .add(Duration(days: days))
                .toIso8601String();

        await Supabase.instance.client
            .from('license_keys')
            .update({
          'status': 'ACTIVE',
          'activated_at': DateTime.now().toUtc().toIso8601String(),
          'expires_at': expiry,
        }).eq('key_code', key);
      }

      if (!mounted) return;

      Navigator.pushReplacement(
        context,
        MaterialPageRoute(
          builder: (_) => DashboardPage(licenseKey: key),
        ),
      );
    } catch (e) {
      showMessage('Connection error.');
    } finally {
      if (mounted) {
        setState(() {
          loading = false;
        });
      }
    }
  }

  void showMessage(String text) {
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(content: Text(text)),
    );
  }

  Future<void> buyKey(String plan, String price) async {
    final message = Uri.encodeComponent(
      'Hello SADEE X DIMA, I want a $plan license for $price.',
    );

    final uri = Uri.parse(
      'https://wa.me/$orderWhatsApp?text=$message',
    );

    await launchUrl(
      uri,
      mode: LaunchMode.externalApplication,
    );
  }

  Widget priceCard(
    String title,
    String price,
  ) {
    return Card(
      color: cardColor,
      child: ListTile(
        leading: const Icon(
          Icons.key,
          color: accent,
        ),
        title: Text(
          title,
          style: const TextStyle(
            fontWeight: FontWeight.bold,
          ),
        ),
        subtitle: Text(price),
        trailing: TextButton(
          onPressed: () => buyKey(title, price),
          child: const Text('BUY'),
        ),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: SafeArea(
        child: ListView(
          padding: const EdgeInsets.all(20),
          children: [
            const SizedBox(height: 35),
            const Icon(
              Icons.bolt,
              size: 70,
              color: accent,
            ),
            const SizedBox(height: 12),
            const Text(
              '𝕤𝕒𝕕𝕖𝕖 𝕏 𝕕𝕚𝕞𝕒',
              textAlign: TextAlign.center,
              style: TextStyle(
                fontSize: 28,
                fontWeight: FontWeight.w900,
              ),
            ),
            const Text(
              'OPTIMIZER',
              textAlign: TextAlign.center,
              style: TextStyle(
                color: accent,
                letterSpacing: 5,
                fontWeight: FontWeight.bold,
              ),
            ),
            const SizedBox(height: 35),
            TextField(
              controller: keyController,
              textCapitalization: TextCapitalization.characters,
              decoration: InputDecoration(
                hintText: 'License Key',
                prefixIcon: const Icon(
                  Icons.vpn_key,
                  color: accent,
                ),
                filled: true,
                fillColor: cardColor,
                border: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(16),
                  borderSide: BorderSide.none,
                ),
              ),
            ),
            const SizedBox(height: 12),
            SizedBox(
              height: 52,
              child: FilledButton(
                onPressed: loading ? null : login,
                child: loading
                    ? const CircularProgressIndicator()
                    : const Text(
                        'LOGIN',
                        style: TextStyle(
                          fontWeight: FontWeight.bold,
                        ),
                      ),
              ),
            ),
            const SizedBox(height: 25),
            const Text(
              'KEY PRICES',
              style: TextStyle(
                color: accent,
                fontWeight: FontWeight.bold,
              ),
            ),
            const SizedBox(height: 8),
            priceCard('7 DAYS', 'Rs. 500'),
            priceCard('1 MONTH', 'Rs. 1,000'),
            priceCard('LIFETIME', 'Rs. 2,200'),
          ],
        ),
      ),
    );
  }
}

class DashboardPage extends StatefulWidget {
  final String licenseKey;

  const DashboardPage({
    super.key,
    required this.licenseKey,
  });

  @override
  State<DashboardPage> createState() => _DashboardPageState();
}

