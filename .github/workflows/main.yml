name: Build Sadee X Dima Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build User + Admin APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            FOUND="$(find "$GITHUB_WORKSPACE" -type f -name pubspec.yaml -not -path '*/.git/*' -print | head -n 1)"
            [ -n "$FOUND" ] || { echo 'ERROR: pubspec.yaml not found'; exit 1; }
            PROJECT_DIR="$(dirname "$FOUND")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          for f in pubspec.yaml lib/main_user.dart lib/main_admin.dart lib/config.dart lib/services/key_service.dart lib/services/optimizer_service.dart lib/screens/license_gate.dart lib/screens/user_home.dart lib/screens/admin_home.dart android/app/build.gradle; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Stabilize Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          sed -i 's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' android/settings.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' android/settings.gradle || true

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Format
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart format lib

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build User APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --flavor user -t lib/main_user.dart

      - name: Build Admin APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --flavor admin -t lib/main_admin.dart

      - name: Collect APKs
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-user-release.apk release/SADEE-DIMA-OPTIMIZER-USER.apk
          cp build/app/outputs/flutter-apk/app-admin-release.apk release/SADEE-DIMA-OPTIMIZER-ADMIN.apk
          ls -lh release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-OPTIMIZER-V6-FINAL
          path: |
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-USER.apk
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-ADMIN.apk
          if-no-files-found: error
