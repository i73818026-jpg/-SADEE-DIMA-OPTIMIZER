name: Build SADEE X DIMA Optimizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # FIND ZIP
      # ==========================================
      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "✅ ZIP found:"
          echo "$ZIP_FILE"

      # ==========================================
      # EXTRACT ZIP
      # ==========================================
      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "✅ ZIP extracted"

      # ==========================================
      # FIND FLUTTER PROJECT
      # ==========================================
      - name: Find Flutter project
        run: |
          PUBSPEC=$(find extracted \
            -type f \
            -name "pubspec.yaml" \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml not found"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ Flutter project:"
          echo "$PROJECT_DIR"

      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      # ==========================================
      # CHECK JAVA / FLUTTER
      # ==========================================
      - name: Check versions
        run: |
          echo "=============================="
          echo "FLUTTER"
          echo "=============================="
          flutter --version

          echo ""
          echo "=============================="
          echo "JAVA"
          echo "=============================="
          java -version

          echo ""
          echo "JAVA_HOME=$JAVA_HOME"

      # ==========================================
      # UPDATE AGP
      # ==========================================
      - name: Update Android Gradle Plugin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/settings.gradle ]; then

            sed -i \
              's/com.android.application" version "[^"]*"/com.android.application" version "8.9.1"/g' \
              android/settings.gradle

            sed -i \
              's/com.android.library" version "[^"]*"/com.android.library" version "8.9.1"/g' \
              android/settings.gradle

          fi

          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.9.1"/g' \
              android/settings.gradle.kts

            sed -i \
              's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.9.1"/g' \
              android/settings.gradle.kts

          fi

          echo "✅ AGP update completed"

      # ==========================================
      # UPDATE GRADLE
      # ==========================================
      - name: Update Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            sed -i \
              's#gradle-[0-9.]*-all.zip#gradle-8.11.1-all.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties

            sed -i \
              's#gradle-[0-9.]*-bin.zip#gradle-8.11.1-bin.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties

          fi

          echo "✅ Gradle update completed"

      # ==========================================
      # FORCE JAVA 17 + KOTLIN 17
      # ==========================================
      - name: Force Java 17 and Kotlin 17
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("❌ android/app/build.gradle not found")

          text = path.read_text()

          print("===== ORIGINAL BUILD.GRADLE =====")
          print(text)

          # --------------------------------------
          # Remove existing compileOptions block
          # --------------------------------------
          text = re.sub(
              r'compileOptions\s*\{[^{}]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # --------------------------------------
          # Remove existing kotlinOptions block
          # --------------------------------------
          text = re.sub(
              r'kotlinOptions\s*\{[^{}]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # --------------------------------------
          # Add Java 17 compile options
          # immediately inside android {}
          # --------------------------------------
          java_config = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """

          if "android {" in text:
              text = text.replace(
                  "android {",
                  "android {" + java_config,
                  1
              )
          else:
              raise SystemExit("❌ android {} block not found")

          # --------------------------------------
          # Add Kotlin JVM 17
          # --------------------------------------
          kotlin_config = """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          text = text.rstrip() + kotlin_config + "\n"

          path.write_text(text)

          print("")
          print("======================================")
          print("✅ JAVA TARGET = 17")
          print("✅ KOTLIN TARGET = 17")
          print("======================================")

          print("")
          print("===== FINAL BUILD.GRADLE =====")
          print(text)
          PY

      # ==========================================
      # VERIFY JVM CONFIG
      # ==========================================
      - name: Verify JVM configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== SEARCHING JVM SETTINGS ====="

          grep -n -E \
            "compileOptions|sourceCompatibility|targetCompatibility|kotlinOptions|jvmTarget" \
            android/app/build.gradle || true

      # ==========================================
      # PUB GET
      # ==========================================
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # ==========================================
      # ANALYZE
      # ==========================================
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze || true

      # ==========================================
      # CLEAN
      # ==========================================
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean

      # ==========================================
      # PUB GET AGAIN
      # ==========================================
      - name: Flutter pub get again
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      # ==========================================
      # CHECK APK
      # ==========================================
      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== GENERATED APK ====="

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      # ==========================================
      # GENERATE TEMPORARY KEY
      # ==========================================
      - name: Generate signing key
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=Optimizer, O=SADEE, L=Sri Lanka, C=LK"

          echo "✅ Signing key created"

      # ==========================================
      # FIND APKSIGNER
      # ==========================================
      - name: Find apksigner
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" \
            -type f \
            -name "apksigner" \
            | head -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner not found"
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "✅ apksigner found:"
          echo "$APKSIGNER"

      # ==========================================
      # SIGN APK
      # ==========================================
      - name: Sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK not found"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out build/app/outputs/flutter-apk/sadee-x-dima-optimizer.apk \
            "$APK"

          echo "✅ APK signed"

      # ==========================================
      # VERIFY SIGNATURE
      # ==========================================
      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SIGNED_APK="build/app/outputs/flutter-apk/sadee-x-dima-optimizer.apk"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          echo ""
          echo "======================================"
          echo "✅ APK SIGNATURE VERIFIED"
          echo "======================================"

          ls -lh "$SIGNED_APK"

      # ==========================================
      # UPLOAD FINAL APK
      # ==========================================
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-FINAL-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/sadee-x-dima-optimizer.apk
          if-no-files-found: error
