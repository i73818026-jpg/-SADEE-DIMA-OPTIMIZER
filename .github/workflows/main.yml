name: Build SADEE X DIMA User + Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found!"
            echo "Upload sadee_x_dima_optimizer_v3_user_admin.zip to repository root."
            exit 1
          fi

          echo "✅ ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "✅ ZIP extracted"

          find extracted -maxdepth 4 -type f | sort

      - name: Find User and Admin
        shell: bash
        run: |
          set -e

          USER_DIR=$(find extracted -type f \
            -path "*/user/pubspec.yaml" \
            -exec dirname {} \; | head -n 1)

          ADMIN_DIR=$(find extracted -type f \
            -path "*/admin/pubspec.yaml" \
            -exec dirname {} \; | head -n 1)

          if [ -z "$USER_DIR" ]; then
            echo "❌ User project not found"
            exit 1
          fi

          if [ -z "$ADMIN_DIR" ]; then
            echo "❌ Admin project not found"
            exit 1
          fi

          echo "USER_DIR=$USER_DIR" >> "$GITHUB_ENV"
          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

          echo "✅ USER: $USER_DIR"
          echo "✅ ADMIN: $ADMIN_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ---------------- USER ----------------

      - name: Create User Flutter Project
        run: |
          set -e

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_user \
            user_build

          rm -rf user_build/lib
          rm -rf user_build/test

          cp -r "$USER_DIR/lib" user_build/lib
          cp "$USER_DIR/pubspec.yaml" user_build/pubspec.yaml

          echo "✅ User source copied"

      - name: Fix User Source
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("user_build/lib/main.dart")
          s = p.read_text()

          # Fix Supabase API
          s = s.replace(
              "Supabase.initialize(url: supabaseUrl, anonKey: supabaseAnonKey)",
              "Supabase.initialize(url: supabaseUrl, publishableKey: supabaseAnonKey)"
          )

          # Fix missing closing parenthesis in Home page
          s = s.replace(
              "          _launchButton(),\n        ]);",
              "          _launchButton(),\n        ]));"
          )

          p.write_text(s)

          print("✅ User main.dart fixed")
          PY

      - name: User Dependencies
        working-directory: user_build
        run: |
          flutter pub get

      - name: User Analyze
        working-directory: user_build
        run: |
          flutter analyze

      - name: Build User APK
        working-directory: user_build
        run: |
          flutter build apk --release

      # ---------------- ADMIN ----------------

      - name: Create Admin Flutter Project
        run: |
          set -e

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_admin \
            admin_build

          rm -rf admin_build/lib
          rm -rf admin_build/test

          cp -r "$ADMIN_DIR/lib" admin_build/lib
          cp "$ADMIN_DIR/pubspec.yaml" admin_build/pubspec.yaml

          echo "✅ Admin source copied"

      - name: Fix Admin Source
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("admin_build/lib/main.dart")
          s = p.read_text()

          # Fix Supabase API
          s = s.replace(
              "Supabase.initialize(url: supabaseUrl, anonKey: supabaseAnonKey)",
              "Supabase.initialize(url: supabaseUrl, publishableKey: supabaseAnonKey)"
          )

          p.write_text(s)

          print("✅ Admin main.dart fixed")
          PY

      - name: Admin Dependencies
        working-directory: admin_build
        run: |
          flutter pub get

      - name: Admin Analyze
        working-directory: admin_build
        run: |
          flutter analyze

      - name: Build Admin APK
        working-directory: admin_build
        run: |
          flutter build apk --release

      # ---------------- APK OUTPUT ----------------

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Complete
        run: |
          echo "======================================"
          echo "✅ SADEE X DIMA BUILD COMPLETE"
          echo "======================================"
          echo "USER APK  : sadee-x-dima-user-apk"
          echo "ADMIN APK : sadee-x-dima-admin-apk"
          echo "======================================"
