name: SADEE X DIMA - REAL SIGNED BUILD

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. FIND ZIP
      # ============================================================

      - name: Find Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " SADEE X DIMA"
          echo " SEARCHING PROJECT ZIP"
          echo "=============================================="

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/SADEE_X_DIMA_OPTIMIZER_REAL_USER_ADMIN.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/SADEE_X_DIMA_OPTIMIZER_REAL_USER_ADMIN.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                | head -n 1 || true
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: No ZIP file found."
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              -print
            exit 1
          fi

          ZIP_FILE="$(realpath "$ZIP_FILE")"

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 4. EXTRACT ZIP
      # ============================================================

      - name: Extract ZIP Project
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " EXTRACTING ZIP"
          echo "=============================================="

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo ""
          echo "ZIP extraction completed."


      # ============================================================
      # 5. LOCATE FLUTTER PROJECT
      # ============================================================

      - name: Locate Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " LOCATING FLUTTER PROJECT"
          echo "=============================================="

          PUBSPEC_FILE="$(
            find "$GITHUB_WORKSPACE/extracted_project" \
              -type f \
              -name "pubspec.yaml" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$PUBSPEC_FILE" ]; then
            echo ""
            echo "ERROR: pubspec.yaml not found."

            echo ""
            echo "Extracted tree:"
            find "$GITHUB_WORKSPACE/extracted_project" \
              -maxdepth 7 \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "PUBSPEC:"
          echo "$PUBSPEC_FILE"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 6. VERIFY PROJECT
      # ============================================================

      - name: Verify Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " VERIFYING PROJECT"
          echo "=============================================="

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart
          test -f android/app/build.gradle

          echo ""
          echo "pubspec.yaml       : OK"
          echo "main_user.dart     : OK"
          echo "main_admin.dart    : OK"
          echo "app/build.gradle   : OK"


      # ============================================================
      # 7. SETUP FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true


      # ============================================================
      # 8. FIX JAVA / KOTLIN JVM 17
      # ============================================================

      - name: Fix JVM Targets
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " CONFIGURING JAVA / KOTLIN JVM 17"
          echo "=============================================="

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "android/app/build.gradle not found"
              )

          s = p.read_text()

          # Remove existing compileOptions blocks.
          s = re.sub(
              r'\n\s*compileOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          # Remove existing kotlinOptions blocks.
          s = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          # Remove existing kotlin toolchain block.
          s = re.sub(
              r'\n\s*kotlin\s*\{\s*jvmToolchain\(.*?\)\s*\}',
              '',
              s,
              flags=re.S
          )

          block = '''
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              kotlin {
                  jvmToolchain(17)
              }

          '''

          marker = "    compileSdk = flutter.compileSdkVersion\n"

          if marker not in s:
              raise SystemExit(
                  "Could not find compileSdk marker"
              )

          s = s.replace(
              marker,
              marker + block,
              1
          )

          p.write_text(s)

          print("Java target       : 17")
          print("Kotlin JVM target : 17")
          print("Kotlin toolchain  : 17")
          PY


      # ============================================================
      # 9. CREATE CORRECT KEYSTORE PATH
      # ============================================================

      - name: Create Release Keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " CREATING RELEASE KEYSTORE"
          echo "=============================================="

          # IMPORTANT:
          #
          # build.gradle uses:
          #
          # file("keystore/sadee-release.jks")
          #
          # Since build.gradle is inside:
          #
          # android/app/
          #
          # the correct location is:
          #
          # android/app/keystore/sadee-release.jks

          mkdir -p android/app/keystore

          KEYSTORE="$PROJECT_DIR/android/app/keystore/sadee-release.jks"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias sadee \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "sadee2026" \
              -keypass "sadee2026" \
              -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

          fi

          if [ ! -f "$KEYSTORE" ]; then
            echo ""
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo ""
          echo "KEYSTORE:"
          echo "$KEYSTORE"

          echo ""
          echo "KEYSTORE EXISTS: YES"


      # ============================================================
      # 10. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure Release Signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " CONFIGURING RELEASE SIGNING"
          echo "=============================================="

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          s = p.read_text()

          # --------------------------------------------------------
          # Remove previously injected signingConfigs block.
          # --------------------------------------------------------

          s = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          # --------------------------------------------------------
          # Remove previous release signing line.
          # --------------------------------------------------------

          s = re.sub(
              r'\n\s*signingConfig\s+signingConfigs\.release',
              '',
              s
          )

          # --------------------------------------------------------
          # Signing configuration.
          # --------------------------------------------------------

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("keystore/sadee-release.jks")
                      storePassword "sadee2026"
                      keyAlias "sadee"
                      keyPassword "sadee2026"
                  }
              }

          '''

          # --------------------------------------------------------
          # Insert signingConfigs before buildTypes.
          # --------------------------------------------------------

          if "buildTypes {" in s:

              s = s.replace(
                  "buildTypes {",
                  signing_block + "buildTypes {",
                  1
              )

          else:

              s += "\n" + signing_block

          # --------------------------------------------------------
          # Find release build type.
          # --------------------------------------------------------

          match = re.search(
              r'(buildTypes\s*\{.*?release\s*\{)',
              s,
              flags=re.S
          )

          if match:

              start = match.end()

              s = (
                  s[:start]
                  + '\n            signingConfig signingConfigs.release\n'
                  + s[start:]
              )

          else:

              # Fallback: append buildTypes.
              s += '''

              android {
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
              '''

          p.write_text(s)

          print("Release signing configured.")
          print("")
          print("Keystore:")
          print("android/app/keystore/sadee-release.jks")
          print("")
          print("Alias:")
          print("sadee")
          PY


      # ============================================================
      # 11. VERIFY SIGNING CONFIG
      # ============================================================

      - name: Verify Signing Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " VERIFYING SIGNING CONFIG"
          echo "=============================================="

          test -f android/app/keystore/sadee-release.jks

          grep -q 'keystore/sadee-release.jks' \
            android/app/build.gradle

          grep -q 'signingConfigs.release' \
            android/app/build.gradle

          echo ""
          echo "Keystore path : OK"
          echo "Signing config: OK"


      # ============================================================
      # 12. SHOW JAVA VERSION
      # ============================================================

      - name: Show Java Version
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " JAVA VERSION"
          echo "=============================================="

          java -version


      # ============================================================
      # 13. FLUTTER CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean


      # ============================================================
      # 14. PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get


      # ============================================================
      # 15. DART FORMAT
      # ============================================================

      - name: Dart Format
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib


      # ============================================================
      # 16. ANALYZE
      # ============================================================

      - name: Flutter Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      # ============================================================
      # 17. BUILD USER APK
      # ============================================================

      - name: Build USER APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo ""
          echo "=============================================="
          echo " BUILDING SIGNED USER APK"
          echo "=============================================="

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart


      # ============================================================
      # 18. BUILD ADMIN APK
      # ============================================================

      - name: Build ADMIN APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo ""
          echo "=============================================="
          echo " BUILDING SIGNED ADMIN APK"
          echo "=============================================="

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart


      # ============================================================
      # 19. LOCATE APKSIGNER
      # ============================================================

      - name: Locate APK Signer
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " LOCATING APKSIGNER"
          echo "=============================================="

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo ""
          echo "APKSIGNER:"
          echo "$APKSIGNER"

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"


      # ============================================================
      # 20. VERIFY USER APK
      # ============================================================

      - name: Verify USER APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-user-release.apk"

          echo "=============================================="
          echo " VERIFYING USER APK"
          echo "=============================================="

          if [ ! -f "$APK" ]; then
            echo "ERROR: USER APK not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "USER APK SIGNATURE: OK"


      # ============================================================
      # 21. VERIFY ADMIN APK
      # ============================================================

      - name: Verify ADMIN APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-admin-release.apk"

          echo "=============================================="
          echo " VERIFYING ADMIN APK"
          echo "=============================================="

          if [ ! -f "$APK" ]; then
            echo "ERROR: ADMIN APK not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "ADMIN APK SIGNATURE: OK"


      # ============================================================
      # 22. APK INFORMATION
      # ============================================================

      - name: Show Final APKs
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"

          echo ""
          echo "=============================================="
          echo " FINAL APK FILES"
          echo "=============================================="

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ============================================================
      # 23. CHECK BOTH APKs
      # ============================================================

      - name: Check APK Count
        shell: bash
        run: |
          set -euo pipefail

          USER_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-user-release.apk"
          ADMIN_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-admin-release.apk"

          test -f "$USER_APK"
          test -f "$ADMIN_APK"

          echo ""
          echo "USER APK  : EXISTS"
          echo "ADMIN APK : EXISTS"


      # ============================================================
      # 24. UPLOAD APKs
      # ============================================================

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-SIGNED-USER-ADMIN
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-user-release.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-admin-release.apk
          if-no-files-found: error


      # ============================================================
      # 25. COMPLETE
      # ============================================================

      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " SADEE X DIMA BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "USER APK  : SIGNED + VERIFIED"
          echo "ADMIN APK : SIGNED + VERIFIED"
          echo ""
          echo "Artifacts are ready."
