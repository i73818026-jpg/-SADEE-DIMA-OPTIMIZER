name: SADEE X DIMA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP EXTRACTED"
          find extracted -maxdepth 5 -type f | sort

      - name: Find User
        shell: bash
        run: |
          set -e

          USER_DIR=$(find extracted -type f -name "pubspec.yaml" -path "*/user/*" -exec dirname {} \; | head -n 1)

          if [ -z "$USER_DIR" ]; then
            echo "ERROR: user project not found"
            exit 1
          fi

          echo "USER PROJECT: $USER_DIR"
          echo "USER_DIR=$USER_DIR" >> "$GITHUB_ENV"

      - name: Find Admin
        shell: bash
        run: |
          set -e

          ADMIN_DIR=$(find extracted -type f -name "pubspec.yaml" -path "*/admin/*" -exec dirname {} \; | head -n 1)

          if [ -z "$ADMIN_DIR" ]; then
            echo "ERROR: admin project not found"
            exit 1
          fi

          echo "ADMIN PROJECT: $ADMIN_DIR"
          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create User App
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_user \
            user_build

      - name: Copy User Files
        run: |
          rm -rf user_build/lib
          rm -rf user_build/test

          cp -r "$USER_DIR/lib" user_build/lib
          cp "$USER_DIR/pubspec.yaml" user_build/pubspec.yaml

      - name: Build User
        working-directory: user_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Create Admin App
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_admin \
            admin_build

      - name: Copy Admin Files
        run: |
          rm -rf admin_build/lib
          rm -rf admin_build/test

          cp -r "$ADMIN_DIR/lib" admin_build/lib
          cp "$ADMIN_DIR/pubspec.yaml" admin_build/pubspec.yaml

      - name: Build Admin
        working-directory: admin_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
