name: Build Sadee X Dima Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Build User App APK
      run: flutter build apk --release -t lib/main_user.dart

    - name: Build Admin Panel APK
      run: flutter build apk --release -t lib/main_admin.dart

    - name: Upload User App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sadee-X-Dima-Optimizer-APK
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload Admin App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sadee-Admin-Panel-APK
        path: build/app/outputs/flutter-apk/app-release.apk
