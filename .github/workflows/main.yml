name: Build SADEE X DIMA Optimizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find ZIP
      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "✅ Found: $ZIP_FILE"

      # 3. Extract ZIP
      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      # 4. Find Flutter project
      - name: Find Flutter project
        run: |
          PUBSPEC=$(find extracted \
            -type f \
            -name "pubspec.yaml" \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ Flutter project:"
          echo "$PROJECT_DIR"

      # 5. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 6. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      # 7. Upgrade AGP
      - name: Update Android Gradle Plugin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/com.android.application" version "[^"]*"/com.android.application" version "8.9.1"/g' android/settings.gradle
            sed -i 's/com.android.library" version "[^"]*"/com.android.library" version "8.9.1"/g' android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.9.1"/g' android/settings.gradle.kts
            sed -i 's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.9.1"/g' android/settings.gradle.kts
          fi

      # 8. Gradle
      - name: Update Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.11.1-all.zip#g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.11.1-bin.zip#g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      # 9. Fix JVM
      - name: Fix JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if path.exists():
              text = path.read_text()

              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              path.write_text(text)

              print("✅ JVM target updated")
          PY

      # 10. Dependencies
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 11. Analyze
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze || true

      # 12. Clean
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter pub get again
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 13. Generate temporary signing key
      - name: Generate release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-keystore.jks \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=Optimizer, O=SADEE, L=Colombo, ST=Western, C=LK"

      # 14. Create key.properties
      - name: Create signing configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=sadee123
          keyPassword=sadee123
          keyAlias=sadee
          storeFile=../release-keystore.jks
          EOF

      # 15. Configure release signing
      - name: Configure Android signing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("android/app/build.gradle not found")

          text = path.read_text()

          if "key.properties" not in text:
              text = """
          import java.util.Properties
          import java.io.FileInputStream

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """ + text

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "buildTypes {",
                  """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              """,
                  1
              )

          path.write_text(text)

          print("✅ Release signing configured")
          PY

      # 16. Build
      - name: Build signed APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      # 17. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK not found"
            exit 1
          fi

          echo "===== APK INFO ====="
          ls -lh "$APK"

          echo ""
          echo "===== APK SIGNATURE ====="

          APKSIGNER=$(find "$ANDROID_HOME" \
            -type f \
            -name "apksigner" \
            | head -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "✅ APK SIGNATURE VERIFIED"

      # 18. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
