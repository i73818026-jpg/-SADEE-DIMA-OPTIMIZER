name: Build SADEE X DIMA User + Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create User Flutter Project
        run: |
          flutter create --org com.sadee.xdima --project-name sadee_optimizer_user user_build
          cp user/pubspec.yaml user_build/pubspec.yaml
          rm -rf user_build/lib
          cp -r user/lib user_build/lib

      - name: Create Admin Flutter Project
        run: |
          flutter create --org com.sadee.xdima --project-name sadee_optimizer_admin admin_build
          cp admin/pubspec.yaml admin_build/pubspec.yaml
          rm -rf admin_build/lib
          cp -r admin/lib admin_build/lib

      - name: Get User Dependencies
        working-directory: user_build
        run: flutter pub get

      - name: Get Admin Dependencies
        working-directory: admin_build
        run: flutter pub get

      - name: Analyze User
        working-directory: user_build
        run: flutter analyze

      - name: Analyze Admin
        working-directory: admin_build
        run: flutter analyze

      - name: Build User APK
        working-directory: user_build
        run: flutter build apk --release

      - name: Build Admin APK
        working-directory: admin_build
        run: flutter build apk --release

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
