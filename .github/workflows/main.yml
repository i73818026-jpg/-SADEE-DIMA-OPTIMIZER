name: Build SADEE-DIMA APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build User and Admin APKs
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' ! -path './.git/*' | sort | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using: $ZIP_FILE"

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted."

      - name: Locate Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(find extracted -name pubspec.yaml -type f | head -n 1)"

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter --version

      - name: Ensure Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/app/build.gradle ]; then
            echo "Android project missing."
            flutter create \
              --platforms=android \
              --org com.sadeedima \
              .
          else
            echo "Android project exists."
          fi

      - name: Configure Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$FILE" ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-all.zip#' \
              "$FILE"
          fi

      - name: Configure Android Versions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="android/settings.gradle"
          BUILD="android/build.gradle"

          if [ -f "$SETTINGS" ]; then

            sed -i -E \
              's/(com\.android\.application[^0-9]*)([0-9]+\.[0-9]+\.[0-9]+)/\18.11.1/g' \
              "$SETTINGS" || true

            sed -i -E \
              's/(org\.jetbrains\.kotlin\.android[^0-9]*)([0-9]+\.[0-9]+\.[0-9]+)/\12.2.20/g' \
              "$SETTINGS" || true

          fi

          if [ -f "$BUILD" ]; then

            sed -i -E \
              's/com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+/com.android.tools.build:gradle:8.11.1/g' \
              "$BUILD" || true

            sed -i -E \
              "s/ext\.kotlin_version[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]/ext.kotlin_version = '2.2.20'/g" \
              "$BUILD" || true

          fi

      - name: Fix MainActivity Uri
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="$(find android/app/src/main/kotlin \
            -name MainActivity.kt \
            -type f \
            | head -n 1)"

          if [ -z "$FILE" ]; then
            echo "::error::MainActivity.kt not found."
            exit 1
          fi

          echo "Using:"
          echo "$FILE"

          if grep -qE 'Uri\.(parse|from)' "$FILE"; then

            if ! grep -q '^import android\.net\.Uri$' "$FILE"; then
              sed -i '/^package /a import android.net.Uri' "$FILE"
              echo "FIXED: android.net.Uri import added."
            else
              echo "Uri import already exists."
            fi

          else
            echo "No Uri usage detected."
          fi

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

      - name: Automatic Dart Fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          dart fix --apply || true

          dart format lib

      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "FLUTTER ANALYZE"
          echo "======================================"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build User APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING USER APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

      - name: Build Admin APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

      - name: Collect APKs
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release_apks

          USER_APK="$(find build/app/outputs/flutter-apk \
            -type f \
            -name '*user*release*.apk' \
            | head -n 1)"

          ADMIN_APK="$(find build/app/outputs/flutter-apk \
            -type f \
            -name '*admin*release*.apk' \
            | head -n 1)"

          if [ -z "$USER_APK" ]; then
            echo "::error::User APK not found."
            find build/app/outputs -type f -name '*.apk'
            exit 1
          fi

          if [ -z "$ADMIN_APK" ]; then
            echo "::error::Admin APK not found."
            find build/app/outputs -type f -name '*.apk'
            exit 1
          fi

          cp "$USER_APK" \
            release_apks/SADEE-DIMA-USER.apk

          cp "$ADMIN_APK" \
            release_apks/SADEE-DIMA-ADMIN.apk

          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          ls -lh release_apks

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-OPTIMIZER-APKs
          path: |
            ${{ env.PROJECT_DIR }}/release_apks/SADEE-DIMA-USER.apk
            ${{ env.PROJECT_DIR }}/release_apks/SADEE-DIMA-ADMIN.apk
          if-no-files-found: error
          retention-days: 30
