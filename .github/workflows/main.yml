name: Build SADEE X DIMA Optimizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Find ZIP
      # ----------------------------------------
      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "✅ ZIP:"
          echo "$ZIP_FILE"

      # ----------------------------------------
      # 3. Extract ZIP
      # ----------------------------------------
      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "✅ ZIP extracted"

      # ----------------------------------------
      # 4. Find Flutter project
      # ----------------------------------------
      - name: Find Flutter project
        run: |
          PUBSPEC=$(find extracted \
            -type f \
            -name "pubspec.yaml" \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml not found"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ Flutter project:"
          echo "$PROJECT_DIR"

      # ----------------------------------------
      # 5. Java 17
      # ----------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ----------------------------------------
      # 6. Flutter
      # ----------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      # ----------------------------------------
      # 7. Versions
      # ----------------------------------------
      - name: Check versions
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo ""
          echo "===== Java ====="
          java -version

          echo ""
          echo "===== JAVA_HOME ====="
          echo "$JAVA_HOME"

      # ----------------------------------------
      # 8. Upgrade AGP
      # ----------------------------------------
      - name: Update Android Gradle Plugin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/settings.gradle ]; then

            sed -i \
              's/com.android.application" version "[^"]*"/com.android.application" version "8.9.1"/g' \
              android/settings.gradle

            sed -i \
              's/com.android.library" version "[^"]*"/com.android.library" version "8.9.1"/g' \
              android/settings.gradle

          fi

          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.9.1"/g' \
              android/settings.gradle.kts

            sed -i \
              's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.9.1"/g' \
              android/settings.gradle.kts

          fi

      # ----------------------------------------
      # 9. Gradle 8.11.1
      # ----------------------------------------
      - name: Update Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            sed -i \
              's#gradle-[0-9.]*-all.zip#gradle-8.11.1-all.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties

            sed -i \
              's#gradle-[0-9.]*-bin.zip#gradle-8.11.1-bin.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties

          fi

      # ----------------------------------------
      # 10. Fix JVM target ONLY
      # ----------------------------------------
      - name: Fix JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              print("⚠️ build.gradle not found")
              raise SystemExit(0)

          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          path.write_text(text)

          print("✅ JVM target fixed")
          PY

      # ----------------------------------------
      # 11. Pub get
      # ----------------------------------------
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ----------------------------------------
      # 12. Analyze
      # ----------------------------------------
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze || true

      # ----------------------------------------
      # 13. Clean
      # ----------------------------------------
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      # ----------------------------------------
      # 14. Pub get again
      # ----------------------------------------
      - name: Flutter pub get again
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ----------------------------------------
      # 15. Build APK
      # ----------------------------------------
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      # ----------------------------------------
      # 16. Find APK
      # ----------------------------------------
      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== APK FILES ====="

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      # ----------------------------------------
      # 17. Generate signing key
      # ----------------------------------------
      - name: Generate temporary signing key
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias sadee \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sadee123 \
            -keypass sadee123 \
            -dname "CN=SADEE X DIMA, OU=Optimizer, O=SADEE, L=Sri Lanka, C=LK"

          echo "✅ Signing key created"

      # ----------------------------------------
      # 18. Locate apksigner
      # ----------------------------------------
      - name: Find apksigner
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" \
            -type f \
            -name "apksigner" \
            | head -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner not found"
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "✅ apksigner:"
          echo "$APKSIGNER"

      # ----------------------------------------
      # 19. Sign APK
      # ----------------------------------------
      - name: Sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK not found:"
            echo "$APK"
            exit 1
          fi

          echo "Signing APK..."

          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias sadee \
            --ks-pass pass:sadee123 \
            --key-pass pass:sadee123 \
            --out build/app/outputs/flutter-apk/sadee-x-dima-optimizer.apk \
            "$APK"

          echo "✅ APK signed"

      # ----------------------------------------
      # 20. Verify APK
      # ----------------------------------------
      - name: Verify signed APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SIGNED_APK="build/app/outputs/flutter-apk/sadee-x-dima-optimizer.apk"

          if [ ! -f "$SIGNED_APK" ]; then
            echo "❌ Signed APK not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          echo ""
          echo "======================================"
          echo "✅ APK SIGNATURE VERIFIED"
          echo "======================================"

          ls -lh "$SIGNED_APK"

      # ----------------------------------------
      # 21. Upload final APK
      # ----------------------------------------
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-FINAL-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/sadee-x-dima-optimizer.apk
          if-no-files-found: error
