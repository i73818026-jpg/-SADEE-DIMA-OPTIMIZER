name: SADEE X DIMA APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP FILE NOT FOUND"
            echo "Please upload the ZIP file to repository root."
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP EXTRACTED SUCCESSFULLY"

      - name: Locate User Project
        shell: bash
        run: |
          set -e

          FILE=$(find extracted -type f -path "*/user/pubspec.yaml" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: user/pubspec.yaml not found"
            find extracted -name "pubspec.yaml"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          echo "USER_DIR=$DIR" >> "$GITHUB_ENV"

          echo "USER PROJECT: $DIR"

      - name: Locate Admin Project
        shell: bash
        run: |
          set -e

          FILE=$(find extracted -type f -path "*/admin/pubspec.yaml" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: admin/pubspec.yaml not found"
            find extracted -name "pubspec.yaml"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          echo "ADMIN_DIR=$DIR" >> "$GITHUB_ENV"

          echo "ADMIN PROJECT: $DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create User App
        shell: bash
        run: |
          set -e

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_user \
            user_build

      - name: Copy User Files
        shell: bash
        run: |
          set -e

          rm -rf user_build/lib
          rm -rf user_build/test

          mkdir -p user_build/lib

          cp -r "$USER_DIR/lib/." user_build/lib/
          cp "$USER_DIR/pubspec.yaml" user_build/pubspec.yaml

      - name: User Dependencies
        working-directory: user_build
        run: flutter pub get

      - name: User Format
        working-directory: user_build
        run: dart format lib

      - name: User Analyze
        working-directory: user_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build User APK
        working-directory: user_build
        run: flutter build apk --release

      - name: Create Admin App
        shell: bash
        run: |
          set -e

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_admin \
            admin_build

      - name: Copy Admin Files
        shell: bash
        run: |
          set -e

          rm -rf admin_build/lib
          rm -rf admin_build/test

          mkdir -p admin_build/lib

          cp -r "$ADMIN_DIR/lib/." admin_build/lib/
          cp "$ADMIN_DIR/pubspec.yaml" admin_build/pubspec.yaml

      - name: Admin Dependencies
        working-directory: admin_build
        run: flutter pub get

      - name: Admin Format
        working-directory: admin_build
        run: dart format lib

      - name: Admin Analyze
        working-directory: admin_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Admin APK
        working-directory: admin_build
        run: flutter build apk --release

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-USER-APK
          path: user_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-ADMIN-APK
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
