name: SADEE X DIMA - Build User + Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in repository root."
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -o "$ZIP_FILE" -d source

          echo "Checking source files..."

          test -f source/user/pubspec.yaml
          test -f source/user/lib/main_user.dart
          test -f source/admin/pubspec.yaml
          test -f source/admin/lib/main_admin.dart

          echo "Source files OK."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create User Project
        shell: bash
        run: |
          set -e

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_x_dima_user \
            --platforms android \
            user_build

          rm -rf user_build/lib
          rm -rf user_build/test

          mkdir -p user_build/lib

          cp source/user/lib/main_user.dart user_build/lib/main_user.dart
          cp source/user/pubspec.yaml user_build/pubspec.yaml

          echo "User project prepared."

      - name: Create Admin Project
        shell: bash
        run: |
          set -e

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_x_dima_admin \
            --platforms android \
            admin_build

          rm -rf admin_build/lib
          rm -rf admin_build/test

          mkdir -p admin_build/lib

          cp source/admin/lib/main_admin.dart admin_build/lib/main_admin.dart
          cp source/admin/pubspec.yaml admin_build/pubspec.yaml

          echo "Admin project prepared."

      - name: User Pub Get
        working-directory: user_build
        run: flutter pub get

      - name: Admin Pub Get
        working-directory: admin_build
        run: flutter pub get

      - name: Format User
        working-directory: user_build
        run: dart format lib/main_user.dart

      - name: Format Admin
        working-directory: admin_build
        run: dart format lib/main_admin.dart

      - name: Analyze User
        working-directory: user_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Analyze Admin
        working-directory: admin_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build User APK
        working-directory: user_build
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          flutter build apk \
            --release \
            -t lib/main_user.dart \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Build Admin APK
        working-directory: admin_build
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          flutter build apk \
            --release \
            -t lib/main_admin.dart \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Rename User APK
        shell: bash
        run: |
          set -e

          cp \
            user_build/build/app/outputs/flutter-apk/app-release.apk \
            user_build/build/app/outputs/flutter-apk/SADEE-X-DIMA-USER.apk

      - name: Rename Admin APK
        shell: bash
        run: |
          set -e

          cp \
            admin_build/build/app/outputs/flutter-apk/app-release.apk \
            admin_build/build/app/outputs/flutter-apk/SADEE-X-DIMA-ADMIN.apk

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-USER
          path: user_build/build/app/outputs/flutter-apk/SADEE-X-DIMA-USER.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-ADMIN
          path: admin_build/build/app/outputs/flutter-apk/SADEE-X-DIMA-ADMIN.apk
          if-no-files-found: error
