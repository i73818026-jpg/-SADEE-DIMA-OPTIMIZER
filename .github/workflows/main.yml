name: SADEE X DIMA - REAL ZIP BUILD

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # FIND ZIP
      # ============================================================

      - name: Find Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " SADEE X DIMA"
          echo " SEARCHING PROJECT ZIP"
          echo "=============================================="

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/SADEE_X_DIMA_OPTIMIZER_REAL_USER_ADMIN.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/SADEE_X_DIMA_OPTIMIZER_REAL_USER_ADMIN.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                | head -n 1 || true
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo ""
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -print
            exit 1
          fi

          ZIP_FILE="$(realpath "$ZIP_FILE")"

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # EXTRACT ZIP
      # ============================================================

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " EXTRACTING ZIP"
          echo "=============================================="

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo ""
          echo "Extraction complete."


      # ============================================================
      # FIND PUBSPEC
      # ============================================================

      - name: Locate Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " LOCATING FLUTTER PROJECT"
          echo "=============================================="

          PUBSPEC_FILE="$(
            find "$GITHUB_WORKSPACE/extracted_project" \
              -type f \
              -name "pubspec.yaml" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$PUBSPEC_FILE" ]; then
            echo "ERROR: pubspec.yaml not found."

            find "$GITHUB_WORKSPACE/extracted_project" \
              -maxdepth 6 \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart
          test -f android/app/build.gradle

          echo "Flutter project verified."


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true


      # ============================================================
      # FORCE ANDROID JVM 17
      # ============================================================

      - name: Fix Android Java Kotlin JVM Targets
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " FIXING JAVA / KOTLIN JVM TARGET"
          echo "=============================================="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit("android/app/build.gradle not found")

          s = p.read_text()

          # Remove old compileOptions block if one exists.
          import re

          s = re.sub(
              r'\n\s*compileOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          s = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          # Insert Java 17 + Kotlin 17 configuration.
          marker = '    compileSdk = flutter.compileSdkVersion\n'

          block = '''
          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          kotlin {
              jvmToolchain(17)
          }

          '''

          if marker not in s:
              raise SystemExit(
                  "Could not find compileSdk marker in app/build.gradle"
              )

          s = s.replace(
              marker,
              marker + block,
              1
          )

          p.write_text(s)

          print("Java target: 17")
          print("Kotlin JVM target: 17")
          print("Kotlin toolchain: 17")
          print("")
          print("Updated android/app/build.gradle")
          PY


      # ============================================================
      # SHOW GRADLE CONFIG
      # ============================================================

      - name: Show Android Build Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " ANDROID BUILD CONFIG"
          echo "=============================================="

          sed -n '1,180p' android/app/build.gradle

          echo ""
          echo "JAVA:"
          java -version


      # ============================================================
      # FLUTTER CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get


      # ============================================================
      # FORMAT
      # ============================================================

      - name: Dart Format
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib


      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Flutter Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      # ============================================================
      # USER APK
      # ============================================================

      - name: Build USER APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " BUILDING USER APK"
          echo "=============================================="

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart


      # ============================================================
      # ADMIN APK
      # ============================================================

      - name: Build ADMIN APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " BUILDING ADMIN APK"
          echo "=============================================="

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart


      # ============================================================
      # CHECK APK
      # ============================================================

      - name: Verify APK Files
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"

          echo "=============================================="
          echo " GENERATED APK FILES"
          echo "=============================================="

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

          COUNT="$(find "$APK_DIR" -type f -name "*.apk" | wc -l)"

          if [ "$COUNT" -lt 2 ]; then
            echo "ERROR: Expected USER + ADMIN APK."
            exit 1
          fi

          echo ""
          echo "APK COUNT: $COUNT"


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload USER + ADMIN APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-REAL-APKs
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error


      # ============================================================
      # DONE
      # ============================================================

      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " SADEE X DIMA BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "USER APK  : READY"
          echo "ADMIN APK : READY"
          echo ""
