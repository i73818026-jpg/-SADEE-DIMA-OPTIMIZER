name: SADEE X DIMA - BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build User + Admin APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ==========================================
      # 4. CHECK
      # ==========================================
      - name: Check tools
        run: |
          flutter --version
          dart --version
          java -version

      # ==========================================
      # 5. CREATE USER FLUTTER PROJECT
      # ==========================================
      - name: Prepare User App
        shell: bash
        run: |
          set -e

          rm -rf user_build

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_x_dima_user \
            --platforms android \
            user_build

          rm -rf user_build/lib
          rm -rf user_build/test

          mkdir -p user_build/lib

          cp user/lib/main_user.dart \
             user_build/lib/main_user.dart

          cp user/pubspec.yaml \
             user_build/pubspec.yaml

      # ==========================================
      # 6. CREATE ADMIN FLUTTER PROJECT
      # ==========================================
      - name: Prepare Admin App
        shell: bash
        run: |
          set -e

          rm -rf admin_build

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_x_dima_admin \
            --platforms android \
            admin_build

          rm -rf admin_build/lib
          rm -rf admin_build/test

          mkdir -p admin_build/lib

          cp admin/lib/main_admin.dart \
             admin_build/lib/main_admin.dart

          cp admin/pubspec.yaml \
             admin_build/pubspec.yaml

      # ==========================================
      # 7. SUPABASE SECRET CHECK
      # ==========================================
      - name: Check Supabase key
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          echo "Supabase key configured."

      # ==========================================
      # 8. USER PUB GET
      # ==========================================
      - name: User pub get
        working-directory: user_build
        run: |
          flutter pub get

      # ==========================================
      # 9. ADMIN PUB GET
      # ==========================================
      - name: Admin pub get
        working-directory: admin_build
        run: |
          flutter pub get

      # ==========================================
      # 10. USER ANALYZE
      # ==========================================
      - name: Analyze User
        working-directory: user_build
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ==========================================
      # 11. ADMIN ANALYZE
      # ==========================================
      - name: Analyze Admin
        working-directory: admin_build
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ==========================================
      # 12. BUILD USER APK
      # ==========================================
      - name: Build User APK
        working-directory: user_build
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk \
            --release \
            -t lib/main_user.dart \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_KEY"

      # ==========================================
      # 13. BUILD ADMIN APK
      # ==========================================
      - name: Build Admin APK
        working-directory: admin_build
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk \
            --release \
            -t lib/main_admin.dart \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_KEY"

      # ==========================================
      # 14. COPY APK
      # ==========================================
      - name: Prepare APK files
        shell: bash
        run: |
          set -e

          cp \
            user_build/build/app/outputs/flutter-apk/app-release.apk \
            SADEE-X-DIMA-OPTIMIZER.apk

          cp \
            admin_build/build/app/outputs/flutter-apk/app-release.apk \
            SADEE-X-DIMA-ADMIN.apk

          echo "================================="
          echo "USER APK"
          echo "================================="
          ls -lh SADEE-X-DIMA-OPTIMIZER.apk

          echo "================================="
          echo "ADMIN APK"
          echo "================================="
          ls -lh SADEE-X-DIMA-ADMIN.apk

      # ==========================================
      # 15. UPLOAD APKs
      # ==========================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APKS
          if-no-files-found: error
          path: |
            SADEE-X-DIMA-OPTIMIZER.apk
            SADEE-X-DIMA-ADMIN.apk
          retention-days: 30
