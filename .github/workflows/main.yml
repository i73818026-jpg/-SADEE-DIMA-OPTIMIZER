name: Build SADEE X DIMA User + Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found!"
            exit 1
          fi

          echo "✅ ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting $ZIP_FILE ..."

          unzip -o "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Find User Project
        shell: bash
        run: |
          set -e

          USER_PUBSPEC=$(find extracted -type f -path "*/user/pubspec.yaml" | head -n 1)

          if [ -z "$USER_PUBSPEC" ]; then
            echo "❌ user/pubspec.yaml not found!"

            echo "Available pubspec files:"
            find extracted -type f -name "pubspec.yaml" | sort

            exit 1
          fi

          USER_DIR=$(dirname "$USER_PUBSPEC")

          echo "✅ USER_DIR=$USER_DIR"
          echo "USER_DIR=$USER_DIR" >> "$GITHUB_ENV"

      - name: Find Admin Project
        shell: bash
        run: |
          set -e

          ADMIN_PUBSPEC=$(find extracted -type f -path "*/admin/pubspec.yaml" | head -n 1)

          if [ -z "$ADMIN_PUBSPEC" ]; then
            echo "❌ admin/pubspec.yaml not found!"

            echo "Available pubspec files:"
            find extracted -type f -name "pubspec.yaml" | sort

            exit 1
          fi

          ADMIN_DIR=$(dirname "$ADMIN_PUBSPEC")

          echo "✅ ADMIN_DIR=$ADMIN_DIR"
          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create User Flutter Project
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_user \
            user_build

      - name: Copy User Source
        run: |
          rm -rf user_build/lib

          cp -r "$USER_DIR/lib" user_build/lib
          cp "$USER_DIR/pubspec.yaml" user_build/pubspec.yaml

          echo "✅ User source copied"

      - name: Create Admin Flutter Project
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_admin \
            admin_build

      - name: Copy Admin Source
        run: |
          rm -rf admin_build/lib

          cp -r "$ADMIN_DIR/lib" admin_build/lib
          cp "$ADMIN_DIR/pubspec.yaml" admin_build/pubspec.yaml

          echo "✅ Admin source copied"

      - name: Get User Dependencies
        working-directory: user_build
        run: flutter pub get

      - name: Get Admin Dependencies
        working-directory: admin_build
        run: flutter pub get

      - name: Analyze User
        working-directory: user_build
        run: flutter analyze

      - name: Analyze Admin
        working-directory: admin_build
        run: flutter analyze

      - name: Build User APK
        working-directory: user_build
        run: flutter build apk --release

      - name: Build Admin APK
        working-directory: admin_build
        run: flutter build apk --release

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
