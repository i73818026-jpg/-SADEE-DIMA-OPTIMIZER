name: SADEE X DIMA - Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 3. FIND ZIP + EXTRACT
      # ============================================================
      - name: Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "SEARCHING FOR PROJECT ZIP"
          echo "======================================"

          ZIP_FILE=""

          while IFS= read -r file; do
            case "$file" in
              *.zip)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path "*/.git/*" \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          echo "======================================"
          echo "EXTRACTING ZIP"
          echo "======================================"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo "======================================"
          echo "SEARCHING pubspec.yaml"
          echo "======================================"

          PUBSPEC=""

          while IFS= read -r file; do
            PUBSPEC="$file"
            break
          done < <(
            find "$GITHUB_WORKSPACE/extracted_project" \
              -type f \
              -name "pubspec.yaml" \
              -print
          )

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."

            echo ""
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted_project" \
              -maxdepth 5 \
              -type f \
              | head -200

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "PROJECT FOUND"
          echo "$PROJECT_DIR"
          echo "======================================"

      # ============================================================
      # 4. VERIFY PROJECT
      # ============================================================
      - name: Verify Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "VERIFYING PROJECT"
          echo "======================================"

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart
          test -f android/app/build.gradle
          test -f android/settings.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

          if ! grep -Fq "productFlavors" android/app/build.gradle; then
            echo "ERROR: productFlavors not found."
            exit 1
          fi

          if ! grep -Eq 'user[[:space:]]*\{' android/app/build.gradle; then
            echo "ERROR: user flavor not found."
            exit 1
          fi

          if ! grep -Eq 'admin[[:space:]]*\{' android/app/build.gradle; then
            echo "ERROR: admin flavor not found."
            exit 1
          fi

          echo "Project verification SUCCESS."

      # ============================================================
      # 5. REPAIR PNG ON RUNNER
      #    ORIGINAL ZIP IS NOT MODIFIED
      # ============================================================
      - name: Repair Logo PNG
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "REPAIRING LOGO PNG"
          echo "======================================"

          python3 -m pip install \
            --quiet \
            --disable-pip-version-check \
            pillow

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          files = [
              Path("assets/sadee_x_dima_logo.png"),
              Path("android/app/src/main/res/drawable-nodpi/sadee_logo.png"),
          ]

          for path in files:
              if not path.exists():
                  print(f"SKIP: {path}")
                  continue

              print(f"Repairing: {path}")

              temp = path.with_name(path.stem + "_fixed.png")

              image = Image.open(path)
              image.load()

              image = image.convert("RGBA")

              image.save(
                  temp,
                  format="PNG",
                  optimize=False,
                  compress_level=6
              )

              temp.replace(path)

              check = Image.open(path)
              check.load()

              if check.format != "PNG":
                  raise RuntimeError(
                      f"PNG validation failed: {path}"
                  )

              print(
                  f"OK: {path} "
                  f"{check.size} {check.mode}"
              )

          print("PNG repair completed.")
          PY

      # ============================================================
      # 6. PATCH GRADLE / AGP / KOTLIN
      #    ONLY EXTRACTED COPY IS CHANGED
      # ============================================================
      - name: Patch Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PATCHING ANDROID BUILD TOOLS"
          echo "======================================"

          # Gradle 8.14.5
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          # AGP + Kotlin in settings.gradle
          if [ -f android/settings.gradle ]; then

            sed -i \
              's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/g' \
              android/settings.gradle || true

            sed -i \
              's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/g' \
              android/settings.gradle || true

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/g' \
              android/settings.gradle || true

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' \
              android/settings.gradle || true

          fi

          # Older build.gradle projects
          if [ -f android/build.gradle ]; then

            sed -i \
              's/com.android.tools.build:gradle:[0-9][0-9.]*/com.android.tools.build:gradle:8.11.1/g' \
              android/build.gradle || true

            sed -i \
              's/ext.kotlin_version[[:space:]]*=[[:space:]]*["'\''][^"'\'']*["'\'']/ext.kotlin_version = "2.2.20"/g' \
              android/build.gradle || true

          fi

          echo "Android build tools patched."

      # ============================================================
      # 7. FLUTTER CLEAN
      # ============================================================
      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

      # ============================================================
      # 8. PUB GET
      # ============================================================
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # ============================================================
      # 9. DART FORMAT
      # ============================================================
      - name: Dart Format
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib

      # ============================================================
      # 10. FLUTTER ANALYZE
      # ============================================================
      - name: Flutter Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ============================================================
      # 11. BUILD USER APK
      # ============================================================
      - name: Build USER APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING USER APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

          echo ""
          echo "USER APK BUILD SUCCESS."

      # ============================================================
      # 12. BUILD ADMIN APK
      # ============================================================
      - name: Build ADMIN APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

          echo ""
          echo "ADMIN APK BUILD SUCCESS."

      # ============================================================
      # 13. COLLECT APKs
      # ============================================================
      - name: Collect APK Files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COLLECTING APK FILES"
          echo "======================================"

          mkdir -p release

          USER_APK="build/app/outputs/flutter-apk/app-user-release.apk"
          ADMIN_APK="build/app/outputs/flutter-apk/app-admin-release.apk"

          if [ ! -f "$USER_APK" ]; then
            echo "ERROR: USER APK not found."

            find build \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          if [ ! -f "$ADMIN_APK" ]; then
            echo "ERROR: ADMIN APK not found."

            find build \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          cp \
            "$USER_APK" \
            "release/SADEE-DIMA-OPTIMIZER-USER.apk"

          cp \
            "$ADMIN_APK" \
            "release/SADEE-DIMA-OPTIMIZER-ADMIN.apk"

          echo ""
          echo "======================================"
          echo "FINAL APK FILES"
          echo "======================================"

          ls -lh release/

      # ============================================================
      # 14. UPLOAD APK ARTIFACTS
      # ============================================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-OPTIMIZER-FINAL-APKs
          path: |
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-USER.apk
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-ADMIN.apk
          if-no-files-found: error

      # ============================================================
      # 15. FINAL RESULT
      # ============================================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       SADEE X DIMA BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "ZIP extraction : SUCCESS"
          echo "Project verify : SUCCESS"
          echo "PNG repair     : SUCCESS"
          echo "Gradle patch   : SUCCESS"
          echo "Flutter pub    : SUCCESS"
          echo "Analyze        : SUCCESS"
          echo "USER APK       : SUCCESS"
          echo "ADMIN APK      : SUCCESS"
          echo ""
          echo "Download the APKs from:"
          echo "GitHub Actions -> Artifacts"
          echo ""
          echo "=============================================="
