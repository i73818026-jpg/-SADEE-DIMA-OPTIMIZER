name: SADEE X DIMA - ZIP BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          if [ -f "SADEE_X_DIMA_OPTIMIZER_REAL_CYBER_V9_FULL_FIXED.zip" ]; then
            ZIP="SADEE_X_DIMA_OPTIMIZER_REAL_CYBER_V9_FULL_FIXED.zip"
          else
            ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1 || true)"
          fi
          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi
          echo "ZIP SOURCE: $ZIP"
          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "$ZIP" -d extracted_project
          PUBSPEC="$(find extracted_project -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            find extracted_project -maxdepth 3 -type f | head -100 || true
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Repair mislabeled logo PNG
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 -m pip install --quiet --disable-pip-version-check --user pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in Path("android/app/src/main/res").rglob("sadee_logo.png"):
              im = Image.open(p)
              im.load()
              tmp = p.with_suffix(".fixed.png")
              im.convert("RGBA").save(tmp, "PNG")
              tmp.replace(p)
              print(f"PNG repaired: {p}")
          PY

      - name: Repair known Dart syntax
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/screens/user_home.dart")
          if not p.exists():
              print("user_home.dart not found; skipping.")
              raise SystemExit(0)
          s = p.read_text()
          s = s.replace("c=='temp'?.5:1", "c == 'temp' ? .5 : 1")
          s = s.replace("c == 'temp'?.5:1", "c == 'temp' ? .5 : 1")
          s = s.replace("c=='temp' ? .5 :1", "c == 'temp' ? .5 : 1")
          s = s.replace("Border.all((x['c'] as Color).withOpacity(.25))",
                        "Border.all(color: (x['c'] as Color).withOpacity(.25))")
          p.write_text(s)
          print("Dart repair completed.")
          PY

      - name: Flutter clean and pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build USER APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release --flavor user -t lib/main_user.dart

      - name: Build ADMIN APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release --flavor admin -t lib/main_admin.dart

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-apks
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
