name: SADEE X DIMA - REAL GAMING BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate source ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 4 -type f -iname '*.zip' -print -quit || true)"
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "$SOURCE_ZIP" -d extracted_project

          PUB="$(find extracted_project -maxdepth 7 -name pubspec.yaml -print -quit)"
          if [ -z "$PUB" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUB")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using $PROJECT_DIR"

      - name: Stabilize Android versions
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's#gradle-[0-9.]+-(all|bin).zip#gradle-8.14.5-\1.zip#g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f android/settings.gradle ]; then
            sed -i -E 's/com\.android\.application:[0-9.]+/com.android.application:8.11.1/g; s/org\.jetbrains\.kotlin\.android:[0-9.]+/org.jetbrains.kotlin.android:2.2.20/g' android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/com\.android\.application:[0-9.]+/com.android.application:8.11.1/g; s/org\.jetbrains\.kotlin\.android:[0-9.]+/org.jetbrains.kotlin.android:2.2.20/g' android/settings.gradle.kts
          fi

      - name: Apply workflow-safe source patches
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path

          service = Path("lib/services/optimizer_service.dart")
          if service.exists():
              text = service.read_text(encoding="utf-8")

              if "Future<void> notifyOperation(" not in text:
                  method = """
            Future<void> notifyOperation(
              String title,
              String message,
            ) async {
              try {
                await _channel.invokeMethod(
                  'notifyUser',
                  <String, dynamic>{
                    'title': title,
                    'text': message,
                  },
                );
              } catch (_) {}
            }

          """
                  pos = text.rfind("\n}")
                  if pos >= 0:
                      text = text[:pos] + "\n" + method + text[pos:]
                      service.write_text(text, encoding="utf-8")

          home = Path("lib/screens/user_home.dart")
          if home.exists():
              text = home.read_text(encoding="utf-8")
              text = text.replace(
                  "Timer.periodic(const Duration(seconds:3)",
                  "Timer.periodic(const Duration(seconds:1)"
              )
              text = text.replace(
                  "['downloads','large','old','duplicates','junk','empty']",
                  """[
                    'downloads',
                    'large',
                    'old',
                    'duplicates',
                    'junk',
                    'empty',
                    'thumbnails',
                    'apk',
                    'temp'
                  ]"""
              )
              home.write_text(text, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text(encoding="utf-8")
              permission = 'android.permission.POST_NOTIFICATIONS'
              if permission not in text:
                  marker = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                  end = text.find(">", text.find("<manifest"))
                  if end >= 0:
                      text = text[:end + 1] + "\n" + marker + text[end + 1:]
                      manifest.write_text(text, encoding="utf-8")

          print("Source patches completed.")
          PY

      - name: Fix Android Uri import
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          MAIN="$(find android/app/src/main -name MainActivity.kt -print -quit || true)"

          if [ -n "$MAIN" ]; then
            if (grep -q 'Uri\.' "$MAIN" || grep -q 'Uri(' "$MAIN") && ! grep -q 'import android.net.Uri' "$MAIN"; then
              sed -i '1i import android.net.Uri' "$MAIN"
            fi
          fi

      - name: Flutter clean and pub get
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Format
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          dart format lib

      - name: Analyze
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build User APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if grep -q "flavorDimensions" android/app/build.gradle 2>/dev/null; then
            flutter build apk --release --flavor user -t lib/main_user.dart
          else
            flutter build apk --release -t lib/main_user.dart
          fi

      - name: Build Admin APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if grep -q "flavorDimensions" android/app/build.gradle 2>/dev/null; then
            flutter build apk --release --flavor admin -t lib/main_admin.dart
          else
            flutter build apk --release -t lib/main_admin.dart
          fi

      - name: Collect APKs
        shell: bash
        run: |
          set -e
          mkdir -p release_apks
          find "$PROJECT_DIR/build/app/outputs/flutter-apk" -type f -name "*.apk" -exec cp {} release_apks/ \;
          ls -lh release_apks

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APKs
          path: release_apks/*.apk
