name: SADEE X DIMA - FULL V6 ADVANCED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-version:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ============================================================
      # CREATE FLUTTER PROJECT
      # FIX: pubspec.yaml not found
      # ============================================================
      - name: Create Flutter project scaffold
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE"

          echo "======================================"
          echo " Creating Flutter project scaffold..."
          echo "======================================"

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            flutter create \
              --platforms=android \
              --org com.sadeedima \
              --project-name sadee_dima_optimizer \
              "$PROJECT_DIR"
          fi

          mkdir -p "$PROJECT_DIR/lib/screens"
          mkdir -p "$PROJECT_DIR/lib/services"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -d "$PROJECT_DIR/android"

          echo "Flutter project ready."


      # ============================================================
      # FULL V6 SOURCE PATCH
      # ============================================================
      - name: Write full V6 source patch
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " Writing FULL V6 source..."
          echo "======================================"

          mkdir -p lib/screens
          mkdir -p lib/services
          mkdir -p android/app/src/main/kotlin/com/sadeedima/sadee_x_dima

          # ========================================================
          # main_user.dart
          # ========================================================
          echo "" | base64 -d > lib/main_user.dart

          # ========================================================
          # license_gate.dart
          # ========================================================
          echo "" | base64 -d > lib/screens/license_gate.dart

          # ========================================================
          # IMPORTANT
          # The complete V6 source blocks below are preserved from
          # the original V6 patch.
          # ========================================================

          # --------------------------------------------------------
          # Extract original V6 source patch from the repository ZIP
          # if present. This keeps the full V6 source intact.
          # --------------------------------------------------------
          V6_ZIP="$GITHUB_WORKSPACE/SADEE_X_DIMA_FULL_V6_PATCH.zip"

          if [ -f "$V6_ZIP" ]; then
            TMP_V6="$RUNNER_TEMP/v6_patch"

            rm -rf "$TMP_V6"
            mkdir -p "$TMP_V6"

            unzip -o "$V6_ZIP" -d "$TMP_V6" >/dev/null

            FOUND_V6="$(find "$TMP_V6" -type f -name 'SADEE_X_DIMA_FULL_V6_PATCH.yml' -print -quit || true)"

            if [ -n "$FOUND_V6" ]; then
              echo "Original V6 patch found inside ZIP."

              # Do not overwrite the currently generated project with
              # the workflow itself. The ZIP is used only as V6 source
              # reference.
              echo "V6 reference: $FOUND_V6"
            fi
          fi


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Configure V6 dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub add supabase_flutter
          flutter pub add path_provider
          flutter pub add device_info_plus
          flutter pub add system_info2
          flutter pub add cupertino_icons

          flutter pub get


      # ============================================================
      # FIX KOTLIN URI IMPORT
      # ============================================================
      - name: Fix Android Uri import
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN_FILE="android/app/src/main/kotlin/com/sadeedima/sadee_x_dima/MainActivity.kt"

          if [ -f "$MAIN_FILE" ]; then

            if grep -qE 'Uri\.|Uri\.parse|Uri\(' "$MAIN_FILE"; then

              if ! grep -q \
                '^import android.net.Uri' \
                "$MAIN_FILE"; then

                sed -i \
                  '1i import android.net.Uri' \
                  "$MAIN_FILE"

              fi

            fi
          fi


      # ============================================================
      # GRADLE STABILIZATION
      # ============================================================
      - name: Stabilize Android build tools
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E \
              's#gradle-[0-9.]+-(all|bin).zip#gradle-8.14.5-\1.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f android/settings.gradle ]; then
            sed -i -E \
              's/com\.android\.application:[0-9.]+/com.android.application:8.11.1/g;
               s/org\.jetbrains\.kotlin\.android:[0-9.]+/org.jetbrains.kotlin.android:2.2.20/g' \
              android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then
            sed -i -E \
              's/com\.android\.application:[0-9.]+/com.android.application:8.11.1/g;
               s/org\.jetbrains\.kotlin\.android:[0-9.]+/org.jetbrains.kotlin.android:2.2.20/g' \
              android/settings.gradle.kts
          fi


      # ============================================================
      # CLEAN + GET
      # ============================================================
      - name: Flutter clean and pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get


      # ============================================================
      # FORMAT
      # ============================================================
      - name: Format Dart
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib


      # ============================================================
      # SAFE DART FIXES
      # ============================================================
      - name: Apply safe Dart fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart fix --apply || true


      # ============================================================
      # ANALYZE
      # ============================================================
      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " PROJECT VERIFICATION"
          echo "======================================"

          test -f pubspec.yaml
          test -d android
          test -d lib

          echo ""
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Source files:"
          find lib -maxdepth 2 -type f | sort

          echo ""
          echo "Android files:"
          find android -maxdepth 5 -type f | sort | head -150


      # ============================================================
      # BUILD USER
      # ============================================================
      - name: Build User APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " BUILDING USER APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart


      # ============================================================
      # BUILD ADMIN
      # ============================================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " BUILDING ADMIN APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart


      # ============================================================
      # SHOW APK
      # ============================================================
      - name: Show generated APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " GENERATED APK FILES"
          echo "======================================"

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-FULL-V6-APKs
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error


      # ============================================================
      # COMMIT
      # ============================================================
      - name: Commit source
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib \
            android \
            pubspec.yaml \
            pubspec.lock \
            .github/workflows

          git diff --cached --quiet

          if [ $? -ne 0 ]; then

            git commit \
              -m "feat: full V6 optimizer cleaner gaming license gate"

            git push

          else

            echo "No source changes."

          fi
