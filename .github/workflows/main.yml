name: SADEE X DIMA - SIGNED REAL BUILD

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # FIND ZIP
      # ============================================================

      - name: Find Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " SEARCHING SADEE X DIMA ZIP"
          echo "=============================================="

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/SADEE_X_DIMA_OPTIMIZER_REAL_USER_ADMIN.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/SADEE_X_DIMA_OPTIMIZER_REAL_USER_ADMIN.zip"
          else
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                | head -n 1 || true
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          ZIP_FILE="$(realpath "$ZIP_FILE")"

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # EXTRACT ZIP
      # ============================================================

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo "ZIP extraction complete."


      # ============================================================
      # LOCATE FLUTTER PROJECT
      # ============================================================

      - name: Locate Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC_FILE="$(
            find "$GITHUB_WORKSPACE/extracted_project" \
              -type f \
              -name "pubspec.yaml" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$PUBSPEC_FILE" ]; then
            echo "ERROR: pubspec.yaml not found."
            find "$GITHUB_WORKSPACE/extracted_project" \
              -maxdepth 6 \
              -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "=============================================="
          echo " FLUTTER PROJECT"
          echo "$PROJECT_DIR"
          echo "=============================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY PROJECT
      # ============================================================

      - name: Verify Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart
          test -f android/app/build.gradle

          echo "Project verification: OK"


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true


      # ============================================================
      # FIX JAVA/KOTLIN JVM 17
      # ============================================================

      - name: Fix JVM Targets
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          s = p.read_text()

          s = re.sub(
              r'\n\s*compileOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          s = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          block = '''
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              kotlin {
                  jvmToolchain(17)
              }
          '''

          marker = "    compileSdk = flutter.compileSdkVersion\n"

          if marker not in s:
              raise SystemExit(
                  "compileSdk marker not found"
              )

          s = s.replace(
              marker,
              marker + block + "\n",
              1
          )

          p.write_text(s)

          print("Java = 17")
          print("Kotlin = 17")
          print("Toolchain = 17")
          PY


      # ============================================================
      # CREATE RELEASE SIGNING KEY
      # ============================================================

      - name: Create Release Signing Key
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p android/keystore

          KEYSTORE="$PROJECT_DIR/android/keystore/sadee-release.jks"

          if [ ! -f "$KEYSTORE" ]; then

            echo "Creating SADEE release keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias sadee \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "sadee2026" \
              -keypass "sadee2026" \
              -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

          fi

          test -f "$KEYSTORE"

          echo "Release keystore created."


      # ============================================================
      # ADD SIGNING CONFIG
      # ============================================================

      - name: Configure Release Signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")

          s = p.read_text()

          signing = '''
              signingConfigs {
                  release {
                      storeFile file("keystore/sadee-release.jks")
                      storePassword "sadee2026"
                      keyAlias "sadee"
                      keyPassword "sadee2026"
                  }
              }

          '''

          marker = "    defaultConfig {"

          if "signingConfigs" not in s:
              s = s.replace(
                  marker,
                  signing + marker,
                  1
              )

          # Add release signing to buildTypes.
          if "buildTypes {" in s:

              if "signingConfig signingConfigs.release" not in s:

                  s = s.replace(
                      "buildTypes {",
                      '''buildTypes {
              release {
                  signingConfig signingConfigs.release
              }
          ''',
                      1
                  )

          else:

              s += '''

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          '''

          p.write_text(s)

          print("Release signing configuration added.")
          PY


      # ============================================================
      # SHOW BUILD CONFIG
      # ============================================================

      - name: Show Android Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " ANDROID BUILD CONFIG"
          echo "=============================================="

          sed -n '1,220p' android/app/build.gradle


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get


      # ============================================================
      # FORMAT
      # ============================================================

      - name: Dart Format
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib


      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Flutter Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      # ============================================================
      # BUILD USER
      # ============================================================

      - name: Build USER APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " BUILDING SIGNED USER APK"
          echo "=============================================="

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart


      # ============================================================
      # BUILD ADMIN
      # ============================================================

      - name: Build ADMIN APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " BUILDING SIGNED ADMIN APK"
          echo "=============================================="

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart


      # ============================================================
      # FIND APKSIGNER
      # ============================================================

      - name: Locate Android APK Signer
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$APKSIGNER"


      # ============================================================
      # VERIFY APK SIGNATURES
      # ============================================================

      - name: Verify USER APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-user-release.apk"

          test -f "$APK"

          echo "=============================================="
          echo " VERIFYING USER APK"
          echo "=============================================="

          "$APKSIGNER" verify \
            --verbose \
            "$APK"


      - name: Verify ADMIN APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-admin-release.apk"

          test -f "$APK"

          echo "=============================================="
          echo " VERIFYING ADMIN APK"
          echo "=============================================="

          "$APKSIGNER" verify \
            --verbose \
            "$APK"


      # ============================================================
      # APK INFORMATION
      # ============================================================

      - name: Check APK Files
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"

          echo ""
          echo "=============================================="
          echo " FINAL APK FILES"
          echo "=============================================="

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-SIGNED-USER-ADMIN
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-user-release.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-admin-release.apk
          if-no-files-found: error


      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " SADEE X DIMA BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "USER APK  : SIGNED + VERIFIED"
          echo "ADMIN APK : SIGNED + VERIFIED"
          echo ""
