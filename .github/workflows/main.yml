name: Build Sadee X Dima Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP + Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================
      # FIND ZIP AND EXTRACT IT
      # ==========================================
      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "======================================"
          echo "SEARCHING FOR ZIP"
          echo "======================================"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            -print | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -not -path "*/.git/*" \
              -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted_project"
          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          echo ""
          echo "EXTRACTING..."

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo ""
          echo "EXTRACTION COMPLETE"

          # ==========================================
          # FIND pubspec.yaml
          # ==========================================

          PUBSPEC=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.git/*" \
            -print | head -n 1 || true)

          if [ -z "$PUBSPEC" ]; then
            echo ""
            echo "ERROR: pubspec.yaml not found."
            echo ""
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted_project" \
              -maxdepth 6 \
              -type f \
              -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo ""
          echo "======================================"
          echo "FLUTTER PROJECT FOUND"
          echo "======================================"
          echo "$PROJECT_DIR"

          # Save for following steps
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # VERIFY PROJECT
      # ==========================================
      - name: Verify Flutter project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          echo ""
          echo "Checking required files..."

          REQUIRED_FILES=(
            "pubspec.yaml"
            "lib/main_user.dart"
            "lib/main_admin.dart"
            "lib/config.dart"
            "lib/services/key_service.dart"
            "lib/services/optimizer_service.dart"
            "lib/screens/user_home.dart"
            "lib/screens/license_gate.dart"
            "lib/screens/admin_home.dart"
            "android/app/build.gradle"
          )

          FAILED=0

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "OK       $FILE"
            else
              echo "MISSING  $FILE"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "ERROR: Required files missing."
            exit 1
          fi

      # ==========================================
      # FLUTTER VERSION
      # ==========================================
      - name: Flutter version
        run: flutter --version

      # ==========================================
      # ANDROID TOOLCHAIN
      # ==========================================
      - name: Fix Android build toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          # Gradle 8.14.5
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          # AGP 8.11.1
          if [ -f android/settings.gradle ]; then
            sed -i \
              's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' \
              android/settings.gradle || true

            sed -i \
              's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' \
              android/settings.gradle || true
          fi

          # Kotlin DSL
          if [ -f android/settings.gradle.kts ]; then
            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' \
              android/settings.gradle.kts || true

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' \
              android/settings.gradle.kts || true
          fi

      # ==========================================
      # PUB GET
      # ==========================================
      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter pub get

      # ==========================================
      # FORMAT
      # ==========================================
      - name: Dart format
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          dart format lib

      # ==========================================
      # ANALYZE
      # ==========================================
      - name: Flutter analyze
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ==========================================
      # CHECK FLAVORS
      # ==========================================
      - name: Verify User Admin flavors
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if grep -R "productFlavors" \
            android/app/build.gradle \
            android/app/build.gradle.kts \
            2>/dev/null; then

            echo "User/Admin flavors detected."

          else
            echo "ERROR: productFlavors not found."
            exit 1
          fi

      # ==========================================
      # BUILD USER
      # ==========================================
      - name: Build User APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

      # ==========================================
      # BUILD ADMIN
      # ==========================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

      # ==========================================
      # COLLECT APK
      # ==========================================
      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          mkdir -p release

          USER_APK="build/app/outputs/flutter-apk/app-user-release.apk"
          ADMIN_APK="build/app/outputs/flutter-apk/app-admin-release.apk"

          if [ ! -f "$USER_APK" ]; then
            echo "ERROR: User APK not found."
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          if [ ! -f "$ADMIN_APK" ]; then
            echo "ERROR: Admin APK not found."
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$USER_APK" \
            release/SADEE-DIMA-OPTIMIZER-USER.apk

          cp "$ADMIN_APK" \
            release/SADEE-DIMA-OPTIMIZER-ADMIN.apk

          ls -lh release/

      # ==========================================
      # UPLOAD APK ARTIFACTS
      # ==========================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-OPTIMIZER-V6-FINAL
          path: |
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-USER.apk
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-ADMIN.apk
          if-no-files-found: error

      # ==========================================
      # SUMMARY
      # ==========================================
      - name: Build summary
        run: |
          echo "=========================================="
          echo "SADEE X DIMA OPTIMIZER V6 BUILD"
          echo "=========================================="
          echo "ZIP extraction : SUCCESS"
          echo "Flutter setup  : SUCCESS"
          echo "User APK       : SUCCESS"
          echo "Admin APK      : SUCCESS"
          echo "=========================================="
