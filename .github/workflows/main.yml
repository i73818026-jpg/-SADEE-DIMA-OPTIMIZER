name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          rm -rf source
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

      - name: Find Flutter Project
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(find source -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create Fresh Flutter Project
        shell: bash
        run: |
          set -e

          rm -rf fresh_app

          flutter create \
            --project-name sadee_x_dima \
            --platforms android \
            fresh_app

      - name: Copy Original App
        shell: bash
        run: |
          set -e

          rm -rf fresh_app/lib
          mkdir -p fresh_app/lib

          cp -R "$SOURCE_DIR/lib/." fresh_app/lib/
          cp "$SOURCE_DIR/pubspec.yaml" fresh_app/pubspec.yaml

          if [ -d "$SOURCE_DIR/assets" ]; then
            cp -R "$SOURCE_DIR/assets" fresh_app/assets
          fi

      - name: Fix Dependencies
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("fresh_app/pubspec.yaml")
          s = p.read_text()

          s = s.replace("system_info2: ^1.0.1", "system_info2: ^4.1.0")

          if "flutter_spinkit:" not in s:
              s = s.replace(
                  "dependencies:\n",
                  "dependencies:\n  flutter_spinkit: ^5.2.1\n",
                  1
              )

          p.write_text(s)
          PY

      - name: Fix Source Code
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("fresh_app/lib")

          # Fix SpinKit widget name.
          for p in root.rglob("*.dart"):
              s = p.read_text()
              s = s.replace("const SpinKitSphereGlider(", "SpinKitThreeBounce(")
              s = s.replace("SpinKitSphereGlider(", "SpinKitThreeBounce(")
              p.write_text(s)

          # Fix the known Admin Home typo if an older ZIP is used.
          p = Path("fresh_app/lib/screens/admin_home.dart")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  '"Device: ${k[\'device_id\'] ?? \'Not Bound\']}",',
                  '"Device: ${k[\'device_id\'] ?? \'Not Bound\'}",'
              )
              p.write_text(s)
          PY

      - name: Remove Default Tests
        run: |
          rm -rf fresh_app/test

      - name: Flutter Pub Get
        working-directory: fresh_app
        run: flutter pub get

      - name: Build User APK
        working-directory: fresh_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.sadee.xdima.user"',
              s,
              count=1
          )

          p.write_text(s)
          PY

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            -t lib/main_user.dart

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/sadee-x-dima-user.apk

      - name: Build Admin APK
        working-directory: fresh_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.sadee.xdima.admin"',
              s,
              count=1
          )

          p.write_text(s)
          PY

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            -t lib/main_admin.dart

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/sadee-x-dima-admin.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-apks
          path: |
            fresh_app/build/app/outputs/flutter-apk/sadee-x-dima-user.apk
            fresh_app/build/app/outputs/flutter-apk/sadee-x-dima-admin.apk
          if-no-files-found: error
