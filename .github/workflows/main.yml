name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

      - name: Find Flutter Project
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(find source -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create Fresh Flutter Project
        run: |
          flutter create \
            --project-name sadee_x_dima \
            --platforms android \
            fresh_app

      - name: Copy App Files
        run: |
          set -e

          rm -rf fresh_app/lib
          mkdir -p fresh_app/lib

          cp -R "$SOURCE_DIR/lib/." fresh_app/lib/
          cp "$SOURCE_DIR/pubspec.yaml" fresh_app/pubspec.yaml

          if [ -d "$SOURCE_DIR/assets" ]; then
            cp -R "$SOURCE_DIR/assets" fresh_app/
          fi

      - name: Fix Dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("fresh_app/pubspec.yaml")
          s = p.read_text()

          s = s.replace(
              "system_info2: ^1.0.1",
              "system_info2: ^4.1.0"
          )

          p.write_text(s)
          PY

      - name: Fix SpinKit Const Error
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path("fresh_app/lib").rglob("*.dart"):
              s = p.read_text()
              s = s.replace(
                  "const SpinKitSphereGlider(",
                  "SpinKitSphereGlider("
              )
              p.write_text(s)
          PY

      - name: Get Dependencies
        working-directory: fresh_app
        run: flutter pub get

      - name: Build APK
        working-directory: fresh_app
        run: flutter build apk --release -t lib/main_user.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-optimizer-apk
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
