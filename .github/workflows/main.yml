      - name: Set User Package ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("fresh_app/android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.sadee.xdima.user"',
              s,
              count=1
          )

          p.write_text(s)
          print("User package ID set")
          PY

      - name: Build User APK
        working-directory: fresh_app
        run: |
          flutter build apk \
            --release \
            -t lib/main_user.dart

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/sadee-x-dima-user.apk

      - name: Set Admin Package ID
        run: |
          python3 - <<'PY'
