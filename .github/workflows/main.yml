name: SADEE X DIMA - FULL V6 ADVANCED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-version:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # FLUTTER
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # FIND FLUTTER PROJECT
      # --------------------------------------------------
      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " Searching for Flutter project..."
          echo "======================================"

          PROJECT_DIR=""

          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_DIR="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "pubspec.yaml" \
                -not -path "*/.git/*" \
                -not -path "*/build/*" \
                -print \
                | head -n 1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: pubspec.yaml not found."
            echo ""
            echo "Repository structure:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | head -300
            exit 1
          fi

          echo ""
          echo "Flutter project found:"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # VERIFY PROJECT
      # --------------------------------------------------
      - name: Verify Flutter project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking pubspec.yaml..."

          test -f pubspec.yaml

          echo "pubspec.yaml FOUND"

      # --------------------------------------------------
      # STABILIZE GRADLE
      # --------------------------------------------------
      - name: Stabilize Android build tools
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Fixing Android build versions..."

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E \
              's#gradle-[0-9.]+-(all|bin).zip#gradle-8.14.5-\1.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f android/settings.gradle ]; then
            sed -i -E \
              's/com\.android\.application:[0-9.]+/com.android.application:8.11.1/g;
               s/org\.jetbrains\.kotlin\.android:[0-9.]+/org.jetbrains.kotlin.android:2.2.20/g' \
              android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then
            sed -i -E \
              's/com\.android\.application:[0-9.]+/com.android.application:8.11.1/g;
               s/org\.jetbrains\.kotlin\.android:[0-9.]+/org.jetbrains.kotlin.android:2.2.20/g' \
              android/settings.gradle.kts
          fi

      # --------------------------------------------------
      # FIX URI IMPORT
      # --------------------------------------------------
      - name: Fix Android Uri import
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="$(
            find android/app/src/main \
              -name "MainActivity.kt" \
              -print \
              | head -n 1
          )"

          if [ -n "$MAIN" ]; then

            if grep -Eq 'Uri\.|Uri\(' "$MAIN"; then

              if ! grep -q '^import android.net.Uri' "$MAIN"; then
                sed -i '1i import android.net.Uri' "$MAIN"
                echo "Added android.net.Uri import"
              fi

            fi
          fi

      # --------------------------------------------------
      # WRITE V6 SOURCE PATCH
      # --------------------------------------------------
      - name: Write full V6 source patch
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Applying V6 source..."

          mkdir -p lib/screens
          mkdir -p lib/services

          # IMPORTANT:
          # Keep your existing V6 source patch content here.
          # This workflow section should contain the source-writing
          # commands from your current V6 workflow.

          echo "V6 source patch location:"
          pwd

      # --------------------------------------------------
      # CLEAN + PUB GET
      # --------------------------------------------------
      - name: Flutter clean and dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

          flutter pub get

      # --------------------------------------------------
      # FORMAT
      # --------------------------------------------------
      - name: Format Dart
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib

      # --------------------------------------------------
      # SAFE FIXES
      # --------------------------------------------------
      - name: Apply Dart fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart fix --apply || true

      # --------------------------------------------------
      # ANALYZE
      # --------------------------------------------------
      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # --------------------------------------------------
      # BUILD USER APK
      # --------------------------------------------------
      - name: Build User APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building USER APK..."

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

      # --------------------------------------------------
      # BUILD ADMIN APK
      # --------------------------------------------------
      - name: Build Admin APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building ADMIN APK..."

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

      # --------------------------------------------------
      # LIST OUTPUT
      # --------------------------------------------------
      - name: Show APK outputs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " APK OUTPUTS"
          echo "======================================"

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print

      # --------------------------------------------------
      # UPLOAD APKs
      # --------------------------------------------------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-FULL-V6-APKs
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # --------------------------------------------------
      # COMMIT CHANGES
      # --------------------------------------------------
      - name: Commit source patch
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lib android .github/workflows

          git diff --cached --quiet

          if [ $? -ne 0 ]; then
            git commit -m "feat: full V6 optimizer cleaner gaming license gate"
            git push
          else
            echo "No changes to commit."
          fi
