name: Build Sadee X Dima Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================
      # FIND + EXTRACT ZIP
      # ==========================================
      - name: Extract Flutter ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "SEARCHING FOR ZIP"
          echo "======================================"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            -print | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          PUBSPEC=$(find \
            "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name "pubspec.yaml" \
            -print | head -n 1 || true)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "PROJECT DIRECTORY"
          echo "$PROJECT_DIR"
          echo "======================================"

      # ==========================================
      # VERIFY PROJECT
      # ==========================================
      - name: Verify Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart
          test -f android/app/build.gradle

          echo "pubspec.yaml    : OK"
          echo "main_user.dart  : OK"
          echo "main_admin.dart : OK"
          echo "build.gradle    : OK"

      # ==========================================
      # REPAIR BROKEN PNG
      # ==========================================
      - name: Repair Logo PNG
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          LOGO="android/app/src/main/res/drawable-nodpi/sadee_logo.png"

          echo "======================================"
          echo "REPAIRING LOGO PNG"
          echo "======================================"

          if [ ! -f "$LOGO" ]; then
            echo "ERROR: Logo not found:"
            echo "$LOGO"
            exit 1
          fi

          echo "Original logo:"
          file "$LOGO" || true

          python3 -m pip install \
            --quiet \
            --disable-pip-version-check \
            pillow

          python3 -c "from PIL import Image; import sys, os; p=sys.argv[1]; t=p+'.fixed.png'; i=Image.open(p); i.load(); i.convert('RGBA').save(t,'PNG',optimize=False,compress_level=6); os.replace(t,p); c=Image.open(p); c.load(); print('PNG OK:',c.format,c.size)" "$LOGO"

          echo "Final logo:"
          file "$LOGO"
          ls -lh "$LOGO"

      # ==========================================
      # FIX MAINACTIVITY KOTLIN
      # ==========================================
      - name: Fix MainActivity Kotlin CPU Reader
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="android/app/src/main/kotlin/com/sadeedima/sadee_x_dima/MainActivity.kt"

          echo "======================================"
          echo "FIXING MAINACTIVITY KOTLIN"
          echo "======================================"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          python3 -c 'import re,sys; p=sys.argv[1]; s=open(p,encoding="utf-8").read(); replacement="""    private fun readCpuUsage(): Double {
        return try {
            fun readCpu(): LongArray {
                val line = File("/proc/stat").useLines { lines ->
                    lines.firstOrNull { it.startsWith("cpu ") }
                }

                if (line == null) {
                    return longArrayOf(0L, 0L)
                }

                val parts = line.trim().split(Regex("\\\\s+"))

                val user = parts.getOrNull(1)?.toLongOrNull() ?: 0L
                val nice = parts.getOrNull(2)?.toLongOrNull() ?: 0L
                val system = parts.getOrNull(3)?.toLongOrNull() ?: 0L
                val idle = parts.getOrNull(4)?.toLongOrNull() ?: 0L
                val io = parts.getOrNull(5)?.toLongOrNull() ?: 0L
                val irq = parts.getOrNull(6)?.toLongOrNull() ?: 0L
                val softIrq = parts.getOrNull(7)?.toLongOrNull() ?: 0L
                val steal = parts.getOrNull(8)?.toLongOrNull() ?: 0L

                val total = user + nice + system + idle + io + irq + softIrq + steal
                val active = total - idle - io

                return longArrayOf(total, active)
            }

            val first = readCpu()

            Thread.sleep(120)

            val second = readCpu()

            val totalDelta = second[0] - first[0]
            val activeDelta = second[1] - first[1]

            if (totalDelta <= 0L) {
                0.0
            } else {
                (activeDelta.toDouble() / totalDelta * 100.0)
                    .coerceIn(0.0, 100.0)
            }
        } catch (_: Exception) {
            0.0
        }
    }
"""; pattern=r"    private fun readCpuUsage\\(\\):Double=.*?(?=    private fun hasAllFilesAccess)"; ns,n=re.subn(pattern,replacement,s,flags=re.S); print("CPU FUNCTION REPLACED:",n); assert n==1,"readCpuUsage function not found"; open(p,"w",encoding="utf-8").write(ns)' "$MAIN"

          echo "Checking patched function..."

          grep -n -A45 "private fun readCpuUsage" "$MAIN"

          echo "MainActivity Kotlin patch completed."

      # ==========================================
      # PATCH ANDROID TOOLCHAIN
      # ==========================================
      - name: Patch Android Toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PATCHING ANDROID TOOLCHAIN"
          echo "======================================"

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.14.5-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f android/settings.gradle ]; then

            sed -i \
              's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' \
              android/settings.gradle || true

            sed -i \
              's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' \
              android/settings.gradle || true

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' \
              android/settings.gradle || true

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' \
              android/settings.gradle || true

          fi

          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' \
              android/settings.gradle.kts || true

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' \
              android/settings.gradle.kts || true

          fi

          echo "Android toolchain patched."

      # ==========================================
      # FLUTTER CLEAN
      # ==========================================
      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

      # ==========================================
      # PUB GET
      # ==========================================
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # ==========================================
      # FORMAT
      # ==========================================
      - name: Dart Format
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib

      # ==========================================
      # ANALYZE
      # ==========================================
      - name: Flutter Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ==========================================
      # VERIFY FLAVORS
      # ==========================================
      - name: Verify Product Flavors
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          BUILD_FILE="android/app/build.gradle"

          echo "======================================"
          echo "CHECKING PRODUCT FLAVORS"
          echo "======================================"

          if ! grep -Fq "productFlavors" "$BUILD_FILE"; then
            echo "ERROR: productFlavors not found."
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*user[[:space:]]*\{' "$BUILD_FILE"; then
            echo "ERROR: user flavor not found."
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*admin[[:space:]]*\{' "$BUILD_FILE"; then
            echo "ERROR: admin flavor not found."
            exit 1
          fi

          echo "productFlavors : OK"
          echo "user flavor    : OK"
          echo "admin flavor   : OK"

      # ==========================================
      # BUILD USER
      # ==========================================
      - name: Build User APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING USER APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

      # ==========================================
      # BUILD ADMIN
      # ==========================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

      # ==========================================
      # COLLECT APK
      # ==========================================
      - name: Collect APK Files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p release

          USER_APK="build/app/outputs/flutter-apk/app-user-release.apk"
          ADMIN_APK="build/app/outputs/flutter-apk/app-admin-release.apk"

          if [ ! -f "$USER_APK" ]; then
            echo "ERROR: User APK not found."

            find build \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          if [ ! -f "$ADMIN_APK" ]; then
            echo "ERROR: Admin APK not found."

            find build \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          cp "$USER_APK" \
            release/SADEE-DIMA-OPTIMIZER-USER.apk

          cp "$ADMIN_APK" \
            release/SADEE-DIMA-OPTIMIZER-ADMIN.apk

          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          ls -lh release/

      # ==========================================
      # UPLOAD APKs
      # ==========================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-OPTIMIZER-APKs
          path: |
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-USER.apk
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-ADMIN.apk
          if-no-files-found: error

      # ==========================================
      # SUMMARY
      # ==========================================
      - name: Build Summary
        run: |
          echo "======================================"
          echo "SADEE X DIMA BUILD COMPLETE"
          echo "======================================"
          echo "ZIP extraction : SUCCESS"
          echo "PNG repair     : SUCCESS"
          echo "Kotlin patch   : SUCCESS"
          echo "Flutter        : SUCCESS"
          echo "User APK       : SUCCESS"
          echo "Admin APK      : SUCCESS"
          echo "ZIP modified   : NO"
          echo "======================================"
