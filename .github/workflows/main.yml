name: SADEE X DIMA - REAL SUPABASE BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build User + Admin APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 3. Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Verify tools
      # --------------------------------------------------
      - name: Check versions
        run: |
          flutter --version
          dart --version
          java -version

      # --------------------------------------------------
      # 5. Prepare User Flutter project
      # --------------------------------------------------
      - name: Create User Android project
        shell: bash
        run: |
          set -e

          rm -rf user_build

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_x_dima_user \
            --platforms android \
            user_build

          rm -rf user_build/lib
          rm -rf user_build/test

          mkdir -p user_build/lib

          cp user/lib/main_user.dart \
             user_build/lib/main_user.dart

          cp user/pubspec.yaml \
             user_build/pubspec.yaml

      # --------------------------------------------------
      # 6. Prepare Admin Flutter project
      # --------------------------------------------------
      - name: Create Admin Android project
        shell: bash
        run: |
          set -e

          rm -rf admin_build

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_x_dima_admin \
            --platforms android \
            admin_build

          rm -rf admin_build/lib
          rm -rf admin_build/test

          mkdir -p admin_build/lib

          cp admin/lib/main_admin.dart \
             admin_build/lib/main_admin.dart

          cp admin/pubspec.yaml \
             admin_build/pubspec.yaml

      # --------------------------------------------------
      # 7. Check Supabase secret
      # --------------------------------------------------
      - name: Validate Supabase publishable key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY GitHub Secret is missing."
            exit 1
          fi

          echo "Supabase publishable key is configured."

      # --------------------------------------------------
      # 8. User dependencies
      # --------------------------------------------------
      - name: User - Flutter pub get
        working-directory: user_build
        run: |
          flutter pub get

      # --------------------------------------------------
      # 9. Admin dependencies
      # --------------------------------------------------
      - name: Admin - Flutter pub get
        working-directory: admin_build
        run: |
          flutter pub get

      # --------------------------------------------------
      # 10. User analyze
      # --------------------------------------------------
      - name: User - Analyze
        working-directory: user_build
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # --------------------------------------------------
      # 11. Admin analyze
      # --------------------------------------------------
      - name: Admin - Analyze
        working-directory: admin_build
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # --------------------------------------------------
      # 12. User release APK
      # --------------------------------------------------
      - name: Build User APK
        working-directory: user_build
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk \
            --release \
            -t lib/main_user.dart \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # --------------------------------------------------
      # 13. Admin release APK
      # --------------------------------------------------
      - name: Build Admin APK
        working-directory: admin_build
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk \
            --release \
            -t lib/main_admin.dart \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # --------------------------------------------------
      # 14. Rename APKs
      # --------------------------------------------------
      - name: Rename APK files
        shell: bash
        run: |
          set -e

          cp \
            user_build/build/app/outputs/flutter-apk/app-release.apk \
            SADEE-X-DIMA-OPTIMIZER.apk

          cp \
            admin_build/build/app/outputs/flutter-apk/app-release.apk \
            SADEE-X-DIMA-ADMIN.apk

          ls -lh *.apk

      # --------------------------------------------------
      # 15. Verify APK files
      # --------------------------------------------------
      - name: Verify APKs
        shell: bash
        run: |
          test -s SADEE-X-DIMA-OPTIMIZER.apk
          test -s SADEE-X-DIMA-ADMIN.apk

          echo "USER APK:"
          ls -lh SADEE-X-DIMA-OPTIMIZER.apk

          echo "ADMIN APK:"
          ls -lh SADEE-X-DIMA-ADMIN.apk

      # --------------------------------------------------
      # 16. Upload artifacts
      # --------------------------------------------------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-RELEASE-APKS
          if-no-files-found: error
          path: |
            SADEE-X-DIMA-OPTIMIZER.apk
            SADEE-X-DIMA-ADMIN.apk
          retention-days: 30
