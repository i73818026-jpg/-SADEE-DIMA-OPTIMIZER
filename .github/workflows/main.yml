name: Build SADEE X DIMA User + Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e

          echo "Repository files:"
          find . -maxdepth 2 -type f ! -path "./.git/*" | sort

          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo "Upload sadee_x_dima_optimizer_v3_user_admin.zip to repository root."
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted:"
          find extracted -maxdepth 4 -type f | sort

      - name: Find Projects
        run: |
          set -e

          USER_DIR=$(find extracted -type f -path "*/user/pubspec.yaml" \
            -exec dirname {} \; | head -n 1)

          ADMIN_DIR=$(find extracted -type f -path "*/admin/pubspec.yaml" \
            -exec dirname {} \; | head -n 1)

          if [ -z "$USER_DIR" ]; then
            echo "ERROR: user project not found"
            exit 1
          fi

          if [ -z "$ADMIN_DIR" ]; then
            echo "ERROR: admin project not found"
            exit 1
          fi

          echo "USER_DIR=$USER_DIR" >> "$GITHUB_ENV"
          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

          echo "User: $USER_DIR"
          echo "Admin: $ADMIN_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create User Project
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_user \
            user_build

          rm -rf user_build/lib
          cp -r "$USER_DIR/lib" user_build/lib
          cp "$USER_DIR/pubspec.yaml" user_build/pubspec.yaml

      - name: Create Admin Project
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_admin \
            admin_build

          rm -rf admin_build/lib
          cp -r "$ADMIN_DIR/lib" admin_build/lib
          cp "$ADMIN_DIR/pubspec.yaml" admin_build/pubspec.yaml

      - name: User Dependencies
        working-directory: user_build
        run: flutter pub get

      - name: Admin Dependencies
        working-directory: admin_build
        run: flutter pub get

      - name: Analyze User
        working-directory: user_build
        run: flutter analyze

      - name: Analyze Admin
        working-directory: admin_build
        run: flutter analyze

      - name: Build User APK
        working-directory: user_build
        run: flutter build apk --release

      - name: Build Admin APK
        working-directory: admin_build
        run: flutter build apk --release

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
