name: SADEE X DIMA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP FILE NOT FOUND"
            find . -maxdepth 3 -type f ! -path "./.git/*"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP EXTRACTED"

      - name: Find Projects
        shell: bash
        run: |
          set -e

          USER_DIR=$(find extracted -type f -path "*/user/pubspec.yaml" -exec dirname {} \; | head -n 1)
          ADMIN_DIR=$(find extracted -type f -path "*/admin/pubspec.yaml" -exec dirname {} \; | head -n 1)

          if [ -z "$USER_DIR" ]; then
            echo "USER PROJECT NOT FOUND"
            find extracted -name pubspec.yaml
            exit 1
          fi

          if [ -z "$ADMIN_DIR" ]; then
            echo "ADMIN PROJECT NOT FOUND"
            find extracted -name pubspec.yaml
            exit 1
          fi

          echo "USER_DIR=$USER_DIR" >> "$GITHUB_ENV"
          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

          echo "USER: $USER_DIR"
          echo "ADMIN: $ADMIN_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # =========================
      # USER APP
      # =========================

      - name: Create User App
        shell: bash
        run: |
          set -e

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_user \
            user_build

          rm -rf user_build/lib
          rm -rf user_build/test

          cp -r "$USER_DIR/lib" user_build/lib
          cp "$USER_DIR/pubspec.yaml" user_build/pubspec.yaml

      - name: Fix User Main Dart
        shell: bash
        run: |
          set -e

          cd user_build

          python3 -c "from pathlib import Path; p=Path('lib/main.dart'); s=p.read_text(); s=s.replace('Supabase.initialize(url: supabaseUrl, anonKey: supabaseAnonKey)', 'Supabase.initialize(url: supabaseUrl, publishableKey: supabaseAnonKey)'); s=s.replace('_launchButton(),\n        ]);', '_launchButton(),\n        ]));'); start=s.find('class ToolPage extends StatelessWidget {'); s=s[:start] + '''class ToolPage extends StatelessWidget {\n  final String title;\n  final IconData icon;\n  final List<String> items;\n\n  const ToolPage({\n    super.key,\n    required this.title,\n    required this.icon,\n    required this.items,\n  });\n\n  @override\n  Widget build(BuildContext context) {\n    return SafeArea(\n      child: ListView(\n        padding: const EdgeInsets.all(18),\n        children: [\n          Row(\n            children: [\n              Icon(icon, color: accent, size: 30),\n              const SizedBox(width: 10),\n              Text(\n                title,\n                style: const TextStyle(\n                  fontSize: 28,\n                  fontWeight: FontWeight.w900,\n                ),\n              ),\n            ],\n          ),\n          const SizedBox(height: 8),\n          const Text(\n            'SADEE X DIMA OPTIMIZER',\n            style: TextStyle(color: Colors.white54),\n          ),\n          const SizedBox(height: 18),\n          ...items.map(\n            (x) => Card(\n              color: card,\n              child: ListTile(\n                leading: const Icon(\n                  Icons.check_circle_outline,\n                  color: accent,\n                ),\n                title: Text(\n                  x,\n                  style: const TextStyle(\n                    fontWeight: FontWeight.bold,\n                  ),\n                ),\n                trailing: const Icon(Icons.chevron_right),\n                onTap: () {\n                  ScaffoldMessenger.of(context).showSnackBar(\n                    SnackBar(\n                      content: Text(\n                        '$x is ready for the device-specific implementation.',\n                      ),\n                    ),\n                  );\n                },\n              ),\n            ),\n          ),\n        ],\n      ),\n    );\n  }\n}\n'''; p.write_text(s)"

          dart format lib

      - name: User Dependencies
        working-directory: user_build
        run: flutter pub get

      - name: Analyze User
        working-directory: user_build
        run: flutter analyze

      - name: Build User APK
        working-directory: user_build
        run: flutter build apk --release

      # =========================
      # ADMIN APP
      # =========================

      - name: Create Admin App
        shell: bash
        run: |
          set -e

          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_admin \
            admin_build

          rm -rf admin_build/lib
          rm -rf admin_build/test

          cp -r "$ADMIN_DIR/lib" admin_build/lib
          cp "$ADMIN_DIR/pubspec.yaml" admin_build/pubspec.yaml

      - name: Fix Admin Main Dart
        shell: bash
        run: |
          set -e

          cd admin_build

          python3 -c "from pathlib import Path; p=Path('lib/main.dart'); s=p.read_text(); s=s.replace('Supabase.initialize(url: supabaseUrl, anonKey: supabaseAnonKey)', 'Supabase.initialize(url: supabaseUrl, publishableKey: supabaseAnonKey)'); p.write_text(s)"

          dart format lib

      - name: Admin Dependencies
        working-directory: admin_build
        run: flutter pub get

      - name: Analyze Admin
        working-directory: admin_build
        run: flutter analyze

      - name: Build Admin APK
        working-directory: admin_build
        run: flutter build apk --release

      # =========================
      # APK ARTIFACTS
      # =========================

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Done
        run: |
          echo "================================"
          echo "SADEE X DIMA BUILD SUCCESS"
          echo "================================"
