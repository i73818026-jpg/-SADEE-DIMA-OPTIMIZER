name: SADEE X DIMA - FULL V6 ADVANCED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Locate Flutter project
        shell: bash
        run: |
          set -e
          if [ -f pubspec.yaml ]; then echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"; else P="$(find . -maxdepth 5 -name pubspec.yaml -print -quit | xargs -r dirname)"; [ -n "$P" ] || { echo "pubspec.yaml not found"; exit 1; }; echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"; fi
      - name: Write full V6 source patch
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          mkdir -p "$(dirname "lib/main_user.dart")"
          echo "" | base64 -d > "lib/main_user.dart"
          mkdir -p "$(dirname "lib/screens/license_gate.dart")"
          echo "" | base64 -d > "lib/screens/license_gate.dart"
          mkdir -p "$(dirname "lib/screens/user_home.dart")"
          echo "" | base64 -d > "lib/screens/user_home.dart"
          mkdir -p "$(dirname "lib/services/optimizer_service.dart")"
          echo "" | base64 -d > "lib/services/optimizer_service.dart"
          mkdir -p "$(dirname "lib/services/key_service.dart")"
          echo "" | base64 -d > "lib/services/key_service.dart"
          mkdir -p "$(dirname "android/app/src/main/kotlin/com/sadeedima/sadee_x_dima/MainActivity.kt")"
          echo "" | base64 -d > "android/app/src/main/kotlin/com/sadeedima/sadee_x_dima/MainActivity.kt"
          mkdir -p "$(dirname "android/app/src/main/AndroidManifest.xml")"
          echo "" | base64 -d > "android/app/src/main/AndroidManifest.xml"
          mkdir -p "$(dirname "android/settings.gradle")"
          echo "" | base64 -d > "android/settings.gradle"
      - name: Stabilize Android build tools
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          sed -i -E 's#gradle-[0-9.]+-(all|bin).zip#gradle-8.14.5-\1.zip#g' android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          sed -i -E 's/com\.android\.application:[0-9.]+/com.android.application:8.11.1/g; s/org\.jetbrains\.kotlin\.android:[0-9.]+/org.jetbrains.kotlin.android:2.2.20/g' android/settings.gradle 2>/dev/null || true
      - name: Dependencies and formatting
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get
          dart format lib
          dart fix --apply || true
      - name: Analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build User APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release --flavor user -t lib/main_user.dart
      - name: Build Admin APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release --flavor admin -t lib/main_admin.dart
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-FULL-V6-APKs
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
      - name: Commit source patch
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib android .github/workflows
          git diff --cached --quiet || git commit -m 'feat: full V6 optimizer cleaner gaming license gate'
          git push
