name: SADEE X DIMA - REAL SIGNED BUILD

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # FIND ZIP
      # ============================================================

      - name: Find Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " SADEE X DIMA"
          echo " SEARCHING ZIP"
          echo "=============================================="

          ZIP_FILE=""

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              | head -n 1 || true
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -print
            exit 1
          fi

          ZIP_FILE="$(realpath "$ZIP_FILE")"

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # EXTRACT ZIP
      # ============================================================

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " EXTRACTING ZIP"
          echo "=============================================="

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo "Extraction complete."


      # ============================================================
      # LOCATE FLUTTER PROJECT
      # ============================================================

      - name: Locate Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " LOCATING FLUTTER PROJECT"
          echo "=============================================="

          PUBSPEC_FILE="$(
            find "$GITHUB_WORKSPACE/extracted_project" \
              -type f \
              -name "pubspec.yaml" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$PUBSPEC_FILE" ]; then
            echo "ERROR: pubspec.yaml not found."

            find "$GITHUB_WORKSPACE/extracted_project" \
              -maxdepth 7 \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # SETUP FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true


      # ============================================================
      # VERIFY PROJECT
      # ============================================================

      - name: Verify Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart
          test -f android/app/build.gradle

          echo "Flutter project OK."


      # ============================================================
      # REPAIR ANDROID BUILD.GRADLE
      #
      # IMPORTANT:
      # signingConfigs MUST be INSIDE android { }
      # ============================================================

      - name: Configure Android Gradle Correctly
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " CONFIGURING ANDROID GRADLE"
          echo "=============================================="

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle not found"
              )

          text = path.read_text()

          # --------------------------------------------------------
          # Remove any old signingConfigs block.
          #
          # This handles blocks accidentally inserted outside
          # android { } by previous workflow versions.
          # --------------------------------------------------------

          def remove_named_block(source, name):
              pattern = re.compile(
                  r'(?m)^[ \t]*' + re.escape(name) + r'\s*\{'
              )

              while True:
                  match = pattern.search(source)

                  if not match:
                      break

                  start = match.start()
                  brace_start = source.find("{", match.start())

                  depth = 0
                  end = None

                  for i in range(brace_start, len(source)):
                      if source[i] == "{":
                          depth += 1
                      elif source[i] == "}":
                          depth -= 1

                          if depth == 0:
                              end = i + 1
                              break

                  if end is None:
                      raise SystemExit(
                          f"Could not safely remove {name} block"
                      )

                  source = source[:start] + source[end:]

              return source


          text = remove_named_block(
              text,
              "signingConfigs"
          )


          # --------------------------------------------------------
          # Remove old release signingConfig lines.
          # --------------------------------------------------------

          text = re.sub(
              r'(?m)^[ \t]*signingConfig\s+signingConfigs\.release\s*$',
              '',
              text
          )


          # --------------------------------------------------------
          # Remove old kotlinOptions blocks.
          # --------------------------------------------------------

          text = remove_named_block(
              text,
              "kotlinOptions"
          )


          # --------------------------------------------------------
          # Remove old compileOptions blocks.
          # --------------------------------------------------------

          text = remove_named_block(
              text,
              "compileOptions"
          )


          # --------------------------------------------------------
          # Remove old kotlin { jvmToolchain(...) } blocks.
          # --------------------------------------------------------

          text = re.sub(
              r'(?s)\n[ \t]*kotlin\s*\{\s*jvmToolchain\s*\(\s*\d+\s*\)\s*\}',
              '',
              text
          )


          # --------------------------------------------------------
          # Find android { block.
          # --------------------------------------------------------

          android_match = re.search(
              r'(?m)^[ \t]*android\s*\{',
              text
          )

          if not android_match:
              raise SystemExit(
                  "android { } block not found"
              )

          android_open = text.find(
              "{",
              android_match.start()
          )


          # --------------------------------------------------------
          # Find matching closing brace of android { }.
          # --------------------------------------------------------

          depth = 0
          android_close = None

          for i in range(android_open, len(text)):

              char = text[i]

              if char == "{":
                  depth += 1

              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      android_close = i
                      break

          if android_close is None:
              raise SystemExit(
                  "Could not determine android block end"
              )


          # --------------------------------------------------------
          # JVM configuration.
          #
          # This goes INSIDE android { }.
          # --------------------------------------------------------

          android_config = r'''
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              kotlin {
                  jvmToolchain(17)
              }

              signingConfigs {
                  release {
                      storeFile file("keystore/sadee-release.jks")
                      storePassword "sadee2026"
                      keyAlias "sadee"
                      keyPassword "sadee2026"
                  }
              }
          '''


          # --------------------------------------------------------
          # Insert JVM + signing configuration directly inside
          # android { }.
          # --------------------------------------------------------

          text = (
              text[:android_close]
              + "\n"
              + android_config
              + "\n"
              + text[android_close:]
          )


          # --------------------------------------------------------
          # Recalculate android block because text changed.
          # --------------------------------------------------------

          android_match = re.search(
              r'(?m)^[ \t]*android\s*\{',
              text
          )

          android_open = text.find(
              "{",
              android_match.start()
          )

          depth = 0
          android_close = None

          for i in range(android_open, len(text)):

              if text[i] == "{":
                  depth += 1

              elif text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      android_close = i
                      break


          android_body = text[
              android_open + 1:
              android_close
          ]


          # --------------------------------------------------------
          # Find buildTypes INSIDE android block.
          # --------------------------------------------------------

          build_match = re.search(
              r'(?m)^[ \t]*buildTypes\s*\{',
              android_body
          )


          if not build_match:

              # No buildTypes -> create one.
              build_block = r'''
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
              '''

              text = (
                  text[:android_close]
                  + "\n"
                  + build_block
                  + "\n"
                  + text[android_close:]
              )

          else:

              # Absolute position of buildTypes opening brace.
              build_start = (
                  android_open
                  + 1
                  + build_match.start()
              )

              build_open = text.find(
                  "{",
                  build_start
              )


              # Find matching buildTypes close.
              depth = 0
              build_close = None

              for i in range(build_open, len(text)):

                  if text[i] == "{":
                      depth += 1

                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          build_close = i
                          break

              if build_close is None:
                  raise SystemExit(
                      "Could not determine buildTypes block"
                  )


              build_body = text[
                  build_open + 1:
                  build_close
              ]


              # ----------------------------------------------------
              # Find release block.
              # ----------------------------------------------------

              release_match = re.search(
                  r'(?m)^[ \t]*release\s*\{',
                  build_body
              )


              if release_match:

                  release_start = (
                      build_open
                      + 1
                      + release_match.start()
                  )

                  release_open = text.find(
                      "{",
                      release_start
                  )

                  depth = 0
                  release_close = None

                  for i in range(
                      release_open,
                      len(text)
                  ):

                      if text[i] == "{":
                          depth += 1

                      elif text[i] == "}":
                          depth -= 1

                          if depth == 0:
                              release_close = i
                              break

                  if release_close is None:
                      raise SystemExit(
                          "Could not determine release block"
                      )


                  release_body = text[
                      release_open + 1:
                      release_close
                  ]


                  release_body = re.sub(
                      r'(?m)^[ \t]*signingConfig.*$',
                      '',
                      release_body
                  )


                  release_body = (
                      "\n"
                      "            signingConfig signingConfigs.release\n"
                      + release_body
                  )


                  text = (
                      text[:release_open + 1]
                      + release_body
                      + text[release_close:]
                  )

              else:

                  # No release block -> create one.
                  release_block = r'''
                      release {
                          signingConfig signingConfigs.release
                      }
                  '''

                  text = (
                      text[:build_open + 1]
                      + "\n"
                      + release_block
                      + text[build_open + 1:]
                  )


          path.write_text(text)

          print("")
          print("Android Gradle repaired successfully.")
          print("")
          print("JAVA:")
          print("17")
          print("")
          print("KOTLIN:")
          print("17")
          print("")
          print("SIGNING:")
          print("android/app/keystore/sadee-release.jks")
          print("")
          print("signingConfigs is INSIDE android { }.")
          print("buildTypes.release uses signingConfigs.release.")
          PY


      # ============================================================
      # CREATE KEYSTORE
      # ============================================================

      - name: Create Release Keystore
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " CREATING RELEASE KEYSTORE"
          echo "=============================================="

          mkdir -p android/app/keystore

          KEYSTORE="$PROJECT_DIR/android/app/keystore/sadee-release.jks"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias sadee \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "sadee2026" \
              -keypass "sadee2026" \
              -dname "CN=SADEE X DIMA, OU=SADEE, O=SADEE X DIMA, L=Colombo, ST=Western, C=LK"

          fi

          test -f "$KEYSTORE"

          echo "Keystore created:"
          echo "$KEYSTORE"


      # ============================================================
      # SHOW FINAL GRADLE
      # ============================================================

      - name: Verify Gradle Signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " VERIFYING GRADLE"
          echo "=============================================="

          test -f android/app/keystore/sadee-release.jks

          grep -q \
            'signingConfigs' \
            android/app/build.gradle

          grep -q \
            'sadee-release.jks' \
            android/app/build.gradle

          grep -q \
            'signingConfigs.release' \
            android/app/build.gradle

          echo "Gradle signing configuration: OK"


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get


      # ============================================================
      # FORMAT
      # ============================================================

      - name: Dart Format
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib


      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Flutter Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      # ============================================================
      # BUILD USER
      # ============================================================

      - name: Build Signed USER APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " BUILDING SIGNED USER APK"
          echo "=============================================="

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart


      # ============================================================
      # BUILD ADMIN
      # ============================================================

      - name: Build Signed ADMIN APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo " BUILDING SIGNED ADMIN APK"
          echo "=============================================="

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart


      # ============================================================
      # FIND APKSIGNER
      # ============================================================

      - name: Find APK Signer
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$APKSIGNER"


      # ============================================================
      # VERIFY USER
      # ============================================================

      - name: Verify USER APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-user-release.apk"

          test -f "$APK"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "USER APK SIGNATURE: OK"


      # ============================================================
      # VERIFY ADMIN
      # ============================================================

      - name: Verify ADMIN APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-admin-release.apk"

          test -f "$APK"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "ADMIN APK SIGNATURE: OK"


      # ============================================================
      # SHOW APKs
      # ============================================================

      - name: Show APK Output
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " FINAL APK OUTPUT"
          echo "=============================================="

          find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ============================================================
      # CHECK FILES
      # ============================================================

      - name: Check Final APKs
        shell: bash
        run: |
          set -euo pipefail

          USER_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-user-release.apk"
          ADMIN_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-admin-release.apk"

          test -f "$USER_APK"
          test -f "$ADMIN_APK"

          echo "USER APK  : READY"
          echo "ADMIN APK : READY"


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-REAL-USER-ADMIN-APKS
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-user-release.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-admin-release.apk
          if-no-files-found: error


      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " SADEE X DIMA BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "USER  APK : SIGNED + VERIFIED"
          echo "ADMIN APK : SIGNED + VERIFIED"
          echo ""
          echo "Download both APKs from Actions Artifacts."
