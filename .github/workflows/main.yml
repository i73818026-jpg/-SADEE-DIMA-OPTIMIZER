name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf source
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

      - name: Find Flutter Project
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(find source -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create Fresh Flutter Project
        run: |
          set -e

          rm -rf fresh_app

          flutter create \
            --project-name sadee_x_dima \
            --platforms android \
            fresh_app

      - name: Copy App Files
        shell: bash
        run: |
          set -e

          rm -rf fresh_app/lib
          mkdir -p fresh_app/lib

          cp -R "$SOURCE_DIR/lib/." fresh_app/lib/
          cp "$SOURCE_DIR/pubspec.yaml" fresh_app/pubspec.yaml

          if [ -d "$SOURCE_DIR/assets" ]; then
            cp -R "$SOURCE_DIR/assets" fresh_app/assets
          fi

      - name: Fix Dependencies
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("fresh_app/pubspec.yaml")
          text = p.read_text()

          text = text.replace(
              "system_info2: ^1.0.1",
              "system_info2: ^4.1.0"
          )

          if "flutter_spinkit:" not in text:
              text = text.replace(
                  "dependencies:\n",
                  "dependencies:\n  flutter_spinkit: ^5.2.1\n",
                  1
              )

          p.write_text(text)
          PY

      - name: Fix SpinKit
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("fresh_app/lib")

          for file in root.rglob("*.dart"):
              text = file.read_text()

              text = text.replace(
                  "const SpinKitSphereGlider(",
                  "SpinKitThreeBounce("
              )

              text = text.replace(
                  "SpinKitSphereGlider(",
                  "SpinKitThreeBounce("
              )

              file.write_text(text)

          print("SpinKit fixed")
          PY

      - name: Fix Admin Home
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("fresh_app/lib/screens/admin_home.dart")
          text = p.read_text()

          old1 = '''"Duration: ${k['duration_days']}d | Status: $status
Device: ${k['device_id'] ?? 'Not Bound'}",'''

          new1 = '''"Duration: ${k['duration_days']}d | Status: $status\\n"
                                "Device: ${k['device_id'] ?? 'Not Bound'}",'''

          text = text.replace(old1, new1)

          old2 = '''"Duration: ${k['duration_days']}d | Status: $status
          Device: ${k['device_id'] ?? 'Not Bound'}",'''

          text = text.replace(old2, new1)

          # Fix the exact broken version from the previous workflow
          broken = '''"Device: ${k['device_id'] ?? 'Not Bound']}",'''

          correct = '''"Device: ${k['device_id'] ?? 'Not Bound'}",'''

          text = text.replace(broken, correct)

          p.write_text(text)

          print("Admin Home fixed")
          PY

      - name: Remove Default Test
        run: |
          rm -rf fresh_app/test

      - name: Flutter Pub Get
        working-directory: fresh_app
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: fresh_app
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build User APK
        working-directory: fresh_app
        run: |
          set -e

          flutter build apk \
            --release \
            -t lib/main_user.dart

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/sadee-x-dima-user.apk

      - name: Build Admin APK
        working-directory: fresh_app
        run: |
          set -e

          flutter build apk \
            --release \
            -t lib/main_admin.dart

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/sadee-x-dima-admin.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-apks
          path: |
            fresh_app/build/app/outputs/flutter-apk/sadee-x-dima-user.apk
            fresh_app/build/app/outputs/flutter-apk/sadee-x-dima-admin.apk
          if-no-files-found: error
