}

class ToolPage extends StatelessWidget {
  final String title;
  final IconData icon;
  final List<String> items;

  const ToolPage({
    super.key,
    required this.title,
    required this.icon,
    required this.items,
  });

  @override
  Widget build(BuildContext context) {
    return SafeArea(
      child: ListView(
        padding: const EdgeInsets.all(18),
        children: [
          Row(
            children: [
              Icon(
                icon,
                color: accent,
                size: 30,
              ),
              const SizedBox(width: 10),
              Text(
                title,
                style: const TextStyle(
                  fontSize: 28,
                  fontWeight: FontWeight.w900,
                ),
              ),
            ],
          ),
          const SizedBox(height: 8),
          const Text(
            'SADEE X DIMA OPTIMIZER',
            style: TextStyle(
              color: Colors.white54,
            ),
          ),
          const SizedBox(height: 18),
          ...items.map(
            (item) => Card(
              color: card,
              child: ListTile(
                leading: const Icon(
                  Icons.check_circle_outline,
                  color: accent,
                ),
                title: Text(
                  item,
                  style: const TextStyle(
                    fontWeight: FontWeight.bold,
                  ),
                ),
                trailing: const Icon(
                  Icons.chevron_right,
                ),
                onTap: () {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(
                      content: Text(
                        '$item selected.',
                      ),
                    ),
                  );
                },
              ),
            ),
          ),
        ],
      ),
    );
  }
}
DART

      - name: Build User
        working-directory: user_build
        run: |
          set -e
          flutter pub get
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      # ==================================================
      # ADMIN
      # ==================================================

      - name: Create Admin Project
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_admin \
            admin_build

      - name: Copy Admin Source
        run: |
          rm -rf admin_build/lib
          rm -rf admin_build/test

          cp -r "$ADMIN_DIR/lib" admin_build/lib
          cp "$ADMIN_DIR/pubspec.yaml" admin_build/pubspec.yaml

      - name: Build Admin
        working-directory: admin_build
        run: |
          set -e
          flutter pub get
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      # ==================================================
      # APK ARTIFACTS
      # ==================================================

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Complete
        run: |
          echo "===================================="
          echo "SADEE X DIMA BUILD COMPLETE"
          echo "===================================="
