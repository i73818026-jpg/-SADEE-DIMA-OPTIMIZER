name: SADEE X DIMA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            echo "Upload the ZIP to repository root"
            exit 1
          fi
          echo "ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted
          echo "ZIP extracted successfully"

      - name: Find User
        run: |
          set -e
          USER_PUBSPEC=$(find extracted -type f -path "*/user/pubspec.yaml" | head -n 1)
          if [ -z "$USER_PUBSPEC" ]; then
            echo "ERROR: user/pubspec.yaml not found"
            find extracted -name pubspec.yaml
            exit 1
          fi
          USER_DIR=$(dirname "$USER_PUBSPEC")
          echo "USER_DIR=$USER_DIR" >> "$GITHUB_ENV"
          echo "User: $USER_DIR"

      - name: Find Admin
        run: |
          set -e
          ADMIN_PUBSPEC=$(find extracted -type f -path "*/admin/pubspec.yaml" | head -n 1)
          if [ -z "$ADMIN_PUBSPEC" ]; then
            echo "ERROR: admin/pubspec.yaml not found"
            find extracted -name pubspec.yaml
            exit 1
          fi
          ADMIN_DIR=$(dirname "$ADMIN_PUBSPEC")
          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"
          echo "Admin: $ADMIN_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Create User Project
        run: |
          flutter create --org com.sadee.xdima --project-name sadee_optimizer_user user_build

      - name: Copy User Source
        run: |
          rm -rf user_build/lib
          mkdir -p user_build/lib
          cp -r "$USER_DIR/lib/." user_build/lib/
          cp "$USER_DIR/pubspec.yaml" user_build/pubspec.yaml
          rm -rf user_build/test

      - name: User Dependencies
        working-directory: user_build
        run: flutter pub get

      - name: User Analyze
        working-directory: user_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build User APK
        working-directory: user_build
        run: flutter build apk --release

      - name: Create Admin Project
        run: |
          flutter create --org com.sadee.xdima --project-name sadee_optimizer_admin admin_build

      - name: Copy Admin Source
        run: |
          rm -rf admin_build/lib
          mkdir -p admin_build/lib
          cp -r "$ADMIN_DIR/lib/." admin_build/lib/
          cp "$ADMIN_DIR/pubspec.yaml" admin_build/pubspec.yaml
          rm -rf admin_build/test

      - name: Admin Dependencies
        working-directory: admin_build
        run: flutter pub get

      - name: Admin Analyze
        working-directory: admin_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Admin APK
        working-directory: admin_build
        run: flutter build apk --release

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
