name: Build Sadee X Dima Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP + Build User/Admin APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================
      # FIND + EXTRACT ZIP
      # ==========================================
      - name: Extract Flutter ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "======================================"
          echo "SEARCHING FOR FLUTTER ZIP"
          echo "======================================"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            -print | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -not -path "*/.git/*" \
              -print

            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted_project"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo ""
          echo "ZIP extraction completed."

          # Find pubspec.yaml
          PUBSPEC=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.git/*" \
            -print | head -n 1 || true)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."

            find "$GITHUB_WORKSPACE/extracted_project" \
              -maxdepth 6 \
              -type f \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo ""
          echo "======================================"
          echo "PROJECT FOUND"
          echo "======================================"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # VERIFY PROJECT
      # ==========================================
      - name: Verify Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo ""

          REQUIRED_FILES=(
            "pubspec.yaml"
            "lib/main_user.dart"
            "lib/main_admin.dart"
            "lib/config.dart"
            "lib/services/key_service.dart"
            "lib/services/optimizer_service.dart"
            "lib/screens/user_home.dart"
            "lib/screens/license_gate.dart"
            "lib/screens/admin_home.dart"
            "android/app/build.gradle"
          )

          FAILED=0

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "OK      $FILE"
            else
              echo "MISSING $FILE"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      # ==========================================
      # FLUTTER VERSION
      # ==========================================
      - name: Flutter Version
        run: flutter --version

      # ==========================================
      # ANDROID TOOLCHAIN
      # ==========================================
      - name: Fix Android Toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          # Gradle
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          # Groovy settings.gradle
          if [ -f android/settings.gradle ]; then

            sed -i \
              's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' \
              android/settings.gradle || true

            sed -i \
              's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' \
              android/settings.gradle || true

          fi

          # Kotlin DSL
          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' \
              android/settings.gradle.kts || true

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' \
              android/settings.gradle.kts || true

          fi

      # ==========================================
      # PUB GET
      # ==========================================
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # ==========================================
      # FORMAT
      # ==========================================
      - name: Dart Format
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib

      # ==========================================
      # ANALYZE
      # ==========================================
      - name: Flutter Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ==========================================
      # VERIFY FLAVORS
      # ==========================================
      - name: Verify User Admin Flavors
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "CHECKING ANDROID FLAVORS"
          echo "======================================"

          BUILD_FILE=""

          if [ -f "android/app/build.gradle" ]; then
            BUILD_FILE="android/app/build.gradle"
          elif [ -f "android/app/build.gradle.kts" ]; then
            BUILD_FILE="android/app/build.gradle.kts"
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Android build file not found."
            exit 1
          fi

          echo "Build file:"
          echo "$BUILD_FILE"

          echo ""

          if grep -Fq "productFlavors" "$BUILD_FILE"; then
            echo "OK: productFlavors found."
          else
            echo "ERROR: productFlavors not found."

            echo ""
            echo "BUILD FILE CONTENT:"
            sed -n '1,260p' "$BUILD_FILE"

            exit 1
          fi

          if grep -Eq '^[[:space:]]*user[[:space:]]*\{' "$BUILD_FILE"; then
            echo "OK: user flavor found."
          else
            echo "ERROR: user flavor not found."
            exit 1
          fi

          if grep -Eq '^[[:space:]]*admin[[:space:]]*\{' "$BUILD_FILE"; then
            echo "OK: admin flavor found."
          else
            echo "ERROR: admin flavor not found."
            exit 1
          fi

          echo ""
          echo "User + Admin flavors verified."

      # ==========================================
      # BUILD USER
      # ==========================================
      - name: Build User APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING USER APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

      # ==========================================
      # BUILD ADMIN
      # ==========================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

      # ==========================================
      # COLLECT APK
      # ==========================================
      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p release

          USER_APK="build/app/outputs/flutter-apk/app-user-release.apk"
          ADMIN_APK="build/app/outputs/flutter-apk/app-admin-release.apk"

          if [ ! -f "$USER_APK" ]; then
            echo "ERROR: User APK not found."
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          if [ ! -f "$ADMIN_APK" ]; then
            echo "ERROR: Admin APK not found."
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$USER_APK" \
            release/SADEE-DIMA-OPTIMIZER-USER.apk

          cp "$ADMIN_APK" \
            release/SADEE-DIMA-OPTIMIZER-ADMIN.apk

          echo ""
          echo "APK files:"
          ls -lh release/

      # ==========================================
      # UPLOAD APKs
      # ==========================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-OPTIMIZER-V6-FINAL
          path: |
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-USER.apk
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-ADMIN.apk
          if-no-files-found: error

      # ==========================================
      # SUMMARY
      # ==========================================
      - name: Build Summary
        run: |
          echo "=========================================="
          echo "SADEE X DIMA OPTIMIZER V6"
          echo "=========================================="
          echo "ZIP extraction : SUCCESS"
          echo "Project detect : SUCCESS"
          echo "Pub get        : SUCCESS"
          echo "Analyze        : SUCCESS"
          echo "Flavors        : SUCCESS"
          echo "User APK       : SUCCESS"
          echo "Admin APK      : SUCCESS"
          echo "=========================================="
