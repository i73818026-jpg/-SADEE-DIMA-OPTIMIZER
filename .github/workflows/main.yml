      icon: Icons.sports_esports,
      items: [
        'Gaming Mode',
        'Game Launcher',
        'Gaming Settings',
      ],
    ),
    FeaturePage(
      title: 'PERFORMANCE',
      icon: Icons.speed,
      items: [
        'RAM Status',
