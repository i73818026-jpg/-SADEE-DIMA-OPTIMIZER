      - name: Patch Real Android System Notifications
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # 1. Flutter: user_home.dart
          # Add a native Android system notification helper
          # ---------------------------------------------------------
          p = Path("lib/screens/user_home.dart")
          text = p.read_text(encoding="utf-8")

          if "Future<void> _systemNotify(" not in text:
              marker = "  Future<void> _cleanSelected() async"

              helper = r'''
            Future<void> _systemNotify(
              String title,
              String message,
            ) async {
              try {
                const channel = MethodChannel(
                  'sadee_x_dima/system',
                );

                await channel.invokeMethod(
                  'notifyUser',
                  <String, dynamic>{
                    'title': title,
                    'text': message,
                  },
                );
              } catch (_) {}
            }

          '''

              if marker not in text:
                  raise SystemExit(
                    "Cannot find _cleanSelected() in user_home.dart"
                  )

              text = text.replace(
                marker,
                helper + marker,
                1,
              )

          # ---------------------------------------------------------
          # 2. Selected cleaner completion
          # ---------------------------------------------------------
          old = r"""_msg('Cleaned ${result['deleted']??0} files • ${_bytes(bytes)}',green);"""

          new = r"""_msg('Cleaned ${result['deleted']??0} files • ${_bytes(bytes)}',green);
            await _systemNotify(
              '🧹 SADEE X DIMA',
              'Cleaner completed • ${result['deleted']??0} files cleaned • ${_bytes(bytes)} freed',
            );"""

          if old in text and "Cleaner completed" not in text:
              text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # 3. App cache cleaner completion
          # ---------------------------------------------------------
          old = r"""_msg('App cache cleaned • ${_bytes(cleared)}',green);"""

          new = r"""_msg('App cache cleaned • ${_bytes(cleared)}',green);
            await _systemNotify(
              '🧹 SADEE X DIMA',
              'Cache cleaner completed • ${_bytes(cleared)} freed',
            );"""

          if old in text and "Cache cleaner completed" not in text:
              text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # 4. RAM cleaner completion
          # ---------------------------------------------------------
          old = r"""_msg('App-owned cleanup done • RAM ${before.toStringAsFixed(0)}% → ${after.toStringAsFixed(0)}% (Android decides system reclaim)',green);"""

          new = r"""_msg('App-owned cleanup done • RAM ${before.toStringAsFixed(0)}% → ${after.toStringAsFixed(0)}% (Android decides system reclaim)',green);
            await _systemNotify(
              '⚡ SADEE X DIMA',
              'RAM cleaner completed • App-owned cleanup finished',
            );"""

          if old in text and "RAM cleaner completed" not in text:
              text = text.replace(old, new, 1)

          p.write_text(text, encoding="utf-8")


          # ---------------------------------------------------------
          # 5. Kotlin: accept notifyUser from Flutter
          # ---------------------------------------------------------
          p = Path(
            "android/app/src/main/kotlin/"
            "com/sadeedima/sadee_x_dima/MainActivity.kt"
          )

          text = p.read_text(encoding="utf-8")

          # Existing native notification function is already present.
          # Add MethodChannel route if it is missing.
          if '"notifyUser"' not in text:
              marker = '                "deleteFiles" ->'

              route = r'''                "notifyUser" -> notifyUser(
                    call.argument<String>("title")
                        ?: "SADEE X DIMA",
                    call.argument<String>("text")
                        ?: ""
                )
'''

              if marker not in text:
                  raise SystemExit(
                    "Cannot find MethodChannel handler in MainActivity.kt"
                  )

              text = text.replace(
                marker,
                route + marker,
                1,
              )

          # Also support notifyOperation if another Flutter screen
          # uses that name.
          if '"notifyOperation"' not in text:
              marker = '                "deleteFiles" ->'

              route = r'''                "notifyOperation" -> notifyUser(
                    call.argument<String>("title")
                        ?: "SADEE X DIMA",
                    call.argument<String>("text")
                        ?: ""
                )
'''

              if marker not in text:
                  raise SystemExit(
                    "Cannot find MethodChannel handler in MainActivity.kt"
                  )

              text = text.replace(
                marker,
                route + marker,
                1,
              )

          p.write_text(text, encoding="utf-8")


          # ---------------------------------------------------------
          # 6. AndroidManifest notification permission
          # ---------------------------------------------------------
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")

          permission = (
            '<uses-permission '
            'android:name="android.permission.POST_NOTIFICATIONS"/>'
          )

          if permission not in text:
              marker = "<manifest"
              pos = text.find(">")
              if pos == -1:
                  raise SystemExit(
                    "Invalid AndroidManifest.xml"
                  )

              text = (
                text[:pos + 1]
                + "\n    "
                + permission
                + text[pos + 1:]
              )

          p.write_text(text, encoding="utf-8")
          PY

      - name: Verify Android System Notification Patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -Fq "sadee_x_dima/system" \
            lib/screens/user_home.dart

          grep -Fq "_systemNotify" \
            lib/screens/user_home.dart

          grep -Fq "notifyUser" \
            android/app/src/main/kotlin/com/sadeedima/sadee_x_dima/MainActivity.kt

          grep -Fq "NotificationManager" \
            android/app/src/main/kotlin/com/sadeedima/sadee_x_dima/MainActivity.kt

          grep -Fq "POST_NOTIFICATIONS" \
            android/app/src/main/AndroidManifest.xml

          echo "REAL ANDROID SYSTEM NOTIFICATION PATCH: OK"
