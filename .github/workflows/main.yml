name: SADEE X DIMA BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build User and Admin APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" \
            -not -path "./extracted_project/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          PUBSPEC=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Verify Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart

          echo "Project verification OK"

      - name: Fix OptimizerService notifyOperation
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/services/optimizer_service.dart")

          if not path.exists():
              raise SystemExit(
                  "ERROR: optimizer_service.dart not found"
              )

          text = path.read_text(encoding="utf-8")

          if "notifyOperation(" not in text:
              method = r'''
            Future<void> notifyOperation(
              String title,
              String message,
            ) async {
              try {
                await _channel.invokeMethod(
                  'notifyUser',
                  <String, dynamic>{
                    'title': title,
                    'text': message,
                  },
                );
              } catch (_) {}
            }
          '''

              marker = "\n  String formatBytes"

              if marker in text:
                  text = text.replace(
                      marker,
                      "\n" + method + marker,
                      1,
                  )
              else:
                  pos = text.rfind("\n}")

                  if pos == -1:
                      raise SystemExit(
                          "ERROR: Could not find "
                          "OptimizerService class end"
                      )

                  text = (
                      text[:pos]
                      + "\n"
                      + method
                      + text[pos:]
                  )

              path.write_text(
                  text,
                  encoding="utf-8",
              )

          if "notifyOperation(" not in path.read_text(
              encoding="utf-8"
          ):
              raise SystemExit(
                  "ERROR: notifyOperation patch failed"
              )

          print("notifyOperation() FIXED")

      - name: Add Notification Permission
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i \
              '2i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' \
              "$MANIFEST"
          fi

          echo "POST_NOTIFICATIONS permission OK"

      - name: Check Android Notification Bridge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN_KOTLIN=$(find android/app/src/main/kotlin \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_KOTLIN" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_KOTLIN"

          if grep -q "notifyUser" "$MAIN_KOTLIN"; then
            echo "Native notifyUser() already exists"
          else
            echo "WARNING: Native notifyUser() not found"
            echo "Build will continue"
          fi

      - name: Repair PNG
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 -m pip install --quiet pillow

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path(
              "android/app/src/main/res"
          )

          if not root.exists():
              print("Android resources not found")
              raise SystemExit(0)

          for path in root.rglob("*.png"):
              try:
                  image = Image.open(path)
                  image.load()
                  image.convert("RGBA").save(
                      path,
                      format="PNG"
                  )
                  print("PNG OK:", path)
              except Exception as error:
                  print(
                      "PNG skipped:",
                      path,
                      error
                  )
          PY

      - name: Fix Gradle Versions
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          GRADLE_FILE="android/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$GRADLE_FILE" ]; then
            sed -i \
              's/gradle-[0-9.]*-all\.zip/gradle-8.14.5-all.zip/g' \
              "$GRADLE_FILE"
          fi

          if [ -f "android/build.gradle" ]; then
            sed -i \
              's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.11.1/g' \
              android/build.gradle || true

            sed -i \
              "s/ext.kotlin_version = ['\"][^'\"]*['\"]/ext.kotlin_version = '2.2.20'/g" \
              android/build.gradle || true
          fi

          echo "Android build versions checked"

      - name: Check Product Flavors
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if ! grep -Rqs "productFlavors" android/app; then
            echo "ERROR: productFlavors not found"
            exit 1
          fi

          echo "productFlavors OK"

      - name: Flutter Clean
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter clean

      - name: Flutter Pub Get
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Dart Format
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          dart format lib

      - name: Verify notifyOperation
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -Fq "notifyOperation" \
            lib/services/optimizer_service.dart

          echo "notifyOperation verified"

      - name: Flutter Analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build User APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p apk_output

          find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -exec cp {} apk_output/ \;

          echo "APK files:"
          ls -lh apk_output

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APKs
          path: apk_output/*.apk
          if-no-files-found: error
