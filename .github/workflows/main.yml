name: SADEE X DIMA V10 PRO CYBER BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Extract V10 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""
          if [ -f "SADEE_X_DIMA_OPTIMIZER_PRO_CYBER_V10_FULL.zip" ]; then
            ZIP="SADEE_X_DIMA_OPTIMIZER_PRO_CYBER_V10_FULL.zip"
          else
            ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found in repository."
            exit 1
          fi

          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "$ZIP" -d extracted_project

          PUBSPEC="$(find extracted_project -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            find extracted_project -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SOURCE PROJECT: $PROJECT_DIR"

      - name: Repair source and logo
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 -m pip install --quiet --disable-pip-version-check --user pillow

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          for p in Path("android/app/src/main/res").rglob("sadee_logo.png"):
              im = Image.open(p)
              im.load()
              tmp = p.with_suffix(".fixed.png")
              im.convert("RGBA").save(tmp, "PNG")
              tmp.replace(p)
              print("PNG OK:", p)

          p = Path("lib/screens/user_home.dart")
          if p.exists():
              s = p.read_text()
              s = s.replace("c=='temp'?.5:1", "c == 'temp' ? .5 : 1")
              s = s.replace("c == 'temp'?.5:1", "c == 'temp' ? .5 : 1")
              s = s.replace("c=='temp' ? .5 :1", "c == 'temp' ? .5 : 1")
              s = s.replace("Border.all((x['c'] as Color).withOpacity(.25))", "Border.all(color: (x['c'] as Color).withOpacity(.25))")
              s = s.replace("final before=cacheBytes; final cleared=await svc.clearAppCache();", "final cleared=await svc.clearAppCache();")
              p.write_text(s)
              print("Dart source repair checked")
          PY

      - name: Stabilize Android build tools
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if p.exists():
              s = p.read_text()
              import re
              s = re.sub(r"gradle-[0-9.]+-all\.zip", "gradle-8.14.5-all.zip", s)
              p.write_text(s)

          for name in ["android/settings.gradle", "android/build.gradle"]:
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  s = s.replace("com.android.application version '8.7.3'", "com.android.application version '8.11.1'")
                  s = s.replace('com.android.application version "8.7.3"', 'com.android.application version "8.11.1"')
                  s = s.replace("org.jetbrains.kotlin.android version '2.0.21'", "org.jetbrains.kotlin.android version '2.2.20'")
                  s = s.replace('org.jetbrains.kotlin.android version "2.0.21"', 'org.jetbrains.kotlin.android version "2.2.20"')
                  s = s.replace("com.android.tools.build:gradle:8.7.3", "com.android.tools.build:gradle:8.11.1")
                  s = s.replace("ext.kotlin_version = '2.0.21'", "ext.kotlin_version = '2.2.20'")
                  p.write_text(s)
          PY

      - name: Flutter clean and pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build USER APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release --flavor user -t lib/main_user.dart

      - name: Build ADMIN APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release --flavor admin -t lib/main_admin.dart

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-v10-apks
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

