name: Build SADEE X DIMA Optimizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Find ZIP
      # --------------------------------------------------
      - name: Find ZIP file
        run: |
          echo "Searching for ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found"
            exit 1
          fi

          echo "✅ ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. Extract ZIP
      # --------------------------------------------------
      - name: Extract Flutter project
        run: |
          rm -rf extracted
          mkdir -p extracted

          echo "📦 Extracting ZIP..."

          unzip -o "$ZIP_FILE" -d extracted

          echo "✅ ZIP extracted"

      # --------------------------------------------------
      # 4. Find pubspec.yaml
      # --------------------------------------------------
      - name: Find Flutter project
        run: |
          PUBSPEC=$(find extracted \
            -type f \
            -name "pubspec.yaml" \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml not found"
            echo ""
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "✅ Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 6. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      # --------------------------------------------------
      # 7. Check versions
      # --------------------------------------------------
      - name: Check Flutter and Java
        run: |
          echo "===== FLUTTER ====="
          flutter --version

          echo ""
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== JAVA HOME ====="
          echo "$JAVA_HOME"

      # --------------------------------------------------
      # 8. Upgrade Android Gradle Plugin
      # --------------------------------------------------
      - name: Upgrade Android Gradle Plugin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Updating Android Gradle Plugin..."

          if [ -f android/settings.gradle ]; then

            sed -i \
              's/com.android.application" version "[^"]*"/com.android.application" version "8.9.1"/g' \
              android/settings.gradle

            sed -i \
              's/com.android.library" version "[^"]*"/com.android.library" version "8.9.1"/g' \
              android/settings.gradle

          fi

          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.9.1"/g' \
              android/settings.gradle.kts

            sed -i \
              's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.9.1"/g' \
              android/settings.gradle.kts

          fi

      # --------------------------------------------------
      # 9. Update Gradle wrapper
      # --------------------------------------------------
      - name: Update Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Updating Gradle wrapper..."

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            sed -i \
              's#gradle-[0-9.]*-all.zip#gradle-8.11.1-all.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties

            sed -i \
              's#gradle-[0-9.]*-bin.zip#gradle-8.11.1-bin.zip#g' \
              android/gradle/wrapper/gradle-wrapper.properties

          fi

      # --------------------------------------------------
      # 10. Fix Java/Kotlin JVM target
      # --------------------------------------------------
      - name: Fix Java and Kotlin JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")

          if gradle_file.exists():

              text = gradle_file.read_text()

              # ------------------------------------------
              # Java 17
              # ------------------------------------------

              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              # ------------------------------------------
              # Kotlin 17
              # ------------------------------------------

              text = text.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              # ------------------------------------------
              # Add Java compile options if missing
              # ------------------------------------------

              if "compileOptions" not in text:

                  text += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

              # ------------------------------------------
              # Add Kotlin JVM target
              # ------------------------------------------

              if "KotlinCompile" not in text:

                  text += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

              gradle_file.write_text(text)

              print("✅ android/app/build.gradle updated")

          else:
              print("⚠️ android/app/build.gradle not found")

      # --------------------------------------------------
      # 11. Show Android configuration
      # --------------------------------------------------
      - name: Show Android files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== Android directory ====="
          ls -la android

          echo ""
          echo "===== App directory ====="
          ls -la android/app

          echo ""
          echo "===== Gradle properties ====="

          if [ -f android/gradle.properties ]; then
            cat android/gradle.properties
          fi

      # --------------------------------------------------
      # 12. Flutter pub get
      # --------------------------------------------------
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # --------------------------------------------------
      # 13. Analyze
      # --------------------------------------------------
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze || true

      # --------------------------------------------------
      # 14. Clean
      # --------------------------------------------------
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean

      # --------------------------------------------------
      # 15. Get packages again
      # --------------------------------------------------
      - name: Flutter pub get again
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # --------------------------------------------------
      # 16. Build Release APK
      # --------------------------------------------------
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      # --------------------------------------------------
      # 17. Check APK
      # --------------------------------------------------
      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== APK FILES ====="

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      # --------------------------------------------------
      # 18. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
