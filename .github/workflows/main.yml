name: SADEE X DIMA - Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 3. FIND + EXTRACT ZIP
      # ============================================================
      - name: Extract Flutter ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "SEARCHING FOR ZIP"
          echo "======================================"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname '*.zip' \
            -not -path '*/.git/*' \
            -print | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted_project"
          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          echo "======================================"
          echo "EXTRACTING ZIP"
          echo "======================================"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo "======================================"
          echo "FINDING pubspec.yaml"
          echo "======================================"

          PUBSPEC="$(find \
            "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name 'pubspec.yaml' \
            -print | head -n 1 || true)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted_project" \
              -maxdepth 4 \
              -type f \
              | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "PROJECT FOUND"
          echo "$PROJECT_DIR"
          echo "======================================"

      # ============================================================
      # 4. VERIFY PROJECT
      # ============================================================
      - name: Verify Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          echo ""
          echo "Checking required files..."

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart
          test -f android/app/build.gradle

          echo ""
          echo "Required files OK."

      # ============================================================
      # 5. REPAIR LOGO PNG
      # ============================================================
      - name: Repair Logo PNG
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          LOGO="android/app/src/main/res/drawable-nodpi/sadee_logo.png"

          echo "======================================"
          echo "CHECKING LOGO"
          echo "======================================"

          if [ ! -f "$LOGO" ]; then
            echo "WARNING: Logo not found."
            echo "Build will continue."
            exit 0
          fi

          echo "Logo found:"
          ls -lh "$LOGO"

          python3 -m pip install \
            --quiet \
            --disable-pip-version-check \
            pillow

          python3 - "$LOGO" <<'PY'
          import sys
          import os
          from PIL import Image

          path = sys.argv[1]
          temp = path + ".fixed.png"

          print("Opening PNG:", path)

          image = Image.open(path)
          image.load()

          print("Original format:", image.format)
          print("Original size:", image.size)
          print("Original mode:", image.mode)

          # Convert to a clean Android-compatible RGBA PNG.
          image = image.convert("RGBA")

          image.save(
              temp,
              format="PNG",
              optimize=False,
              compress_level=6
          )

          os.replace(temp, path)

          check = Image.open(path)
          check.load()

          print("Repaired format:", check.format)
          print("Repaired size:", check.size)
          print("Repaired mode:", check.mode)

          if check.format != "PNG":
              raise SystemExit("ERROR: PNG repair failed.")

          print("PNG repair SUCCESS.")
          PY

          file "$LOGO"

      # ============================================================
      # 6. FIX MAINACTIVITY KOTLIN
      # ============================================================
      - name: Repair MainActivity Kotlin
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="android/app/src/main/kotlin/com/sadeedima/sadee_x_dima/MainActivity.kt"

          echo "======================================"
          echo "CHECKING MAINACTIVITY"
          echo "======================================"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN"

          python3 - "$MAIN" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              source = f.read()

          replacement = r'''    private fun readCpuUsage(): Double {
          return try {
              fun readCpu(): LongArray {
                  val line = File("/proc/stat").useLines { lines ->
                      lines.firstOrNull { it.startsWith("cpu ") }
                  }

                  if (line == null) {
                      return longArrayOf(0L, 0L)
                  }

                  val parts = line.trim().split(Regex("\\s+"))

                  val user = parts.getOrNull(1)?.toLongOrNull() ?: 0L
                  val nice = parts.getOrNull(2)?.toLongOrNull() ?: 0L
                  val system = parts.getOrNull(3)?.toLongOrNull() ?: 0L
                  val idle = parts.getOrNull(4)?.toLongOrNull() ?: 0L
                  val io = parts.getOrNull(5)?.toLongOrNull() ?: 0L
                  val irq = parts.getOrNull(6)?.toLongOrNull() ?: 0L
                  val softIrq = parts.getOrNull(7)?.toLongOrNull() ?: 0L
                  val steal = parts.getOrNull(8)?.toLongOrNull() ?: 0L

                  val total =
                      user +
                      nice +
                      system +
                      idle +
                      io +
                      irq +
                      softIrq +
                      steal

                  val active = total - idle - io

                  return longArrayOf(total, active)
              }

              val first = readCpu()

              Thread.sleep(120)

              val second = readCpu()

              val totalDelta =
                  second[0] - first[0]

              val activeDelta =
                  second[1] - first[1]

              if (totalDelta <= 0L) {
                  0.0
              } else {
                  (
                      activeDelta.toDouble() /
                      totalDelta.toDouble() *
                      100.0
                  ).coerceIn(0.0, 100.0)
              }

          } catch (_: Exception) {
              0.0
          }
      }
      '''

          pattern = re.compile(
              r'(?ms)^    private fun readCpuUsage\(\): Double\s*\{.*?^    private fun hasAllFilesAccess'
          )

          match = pattern.search(source)

          if match:
              fixed = (
                  source[:match.start()]
                  + replacement
                  + "    private fun hasAllFilesAccess"
                  + source[match.end():]
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(fixed)

              print("readCpuUsage() replaced successfully.")

          else:
              print(
                  "readCpuUsage() pattern not found. "
                  "Checking whether file already compiles."
              )

          # Remove accidental duplicate blank lines only.
          with open(path, "r", encoding="utf-8") as f:
              final_source = f.read()

          print("MainActivity.kt size:", len(final_source))

          if "Missing return statement" in final_source:
              raise SystemExit(
                  "ERROR: Invalid text remained in MainActivity.kt."
              )

          print("MainActivity patch complete.")
          PY

      # ============================================================
      # 7. PATCH ANDROID TOOLCHAIN
      # ============================================================
      - name: Patch Android Toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PATCHING ANDROID TOOLCHAIN"
          echo "======================================"

          # Gradle
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.14.5-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          # settings.gradle
          if [ -f android/settings.gradle ]; then

            sed -i \
              's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/g' \
              android/settings.gradle || true

            sed -i \
              's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/g' \
              android/settings.gradle || true

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/g' \
              android/settings.gradle || true

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' \
              android/settings.gradle || true

          fi

          # settings.gradle.kts
          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/g' \
              android/settings.gradle.kts || true

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' \
              android/settings.gradle.kts || true

          fi

          echo "Android toolchain patch complete."

      # ============================================================
      # 8. VERIFY PRODUCT FLAVORS
      # ============================================================
      - name: Verify Product Flavors
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          BUILD_FILE="android/app/build.gradle"

          echo "======================================"
          echo "CHECKING PRODUCT FLAVORS"
          echo "======================================"

          if ! grep -Fq "productFlavors" "$BUILD_FILE"; then
            echo "ERROR: productFlavors not found."
            echo ""
            echo "build.gradle:"
            cat "$BUILD_FILE"
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*user[[:space:]]*\{' "$BUILD_FILE"; then
            echo "ERROR: user flavor not found."
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*admin[[:space:]]*\{' "$BUILD_FILE"; then
            echo "ERROR: admin flavor not found."
            exit 1
          fi

          echo "productFlavors: OK"
          echo "user flavor: OK"
          echo "admin flavor: OK"

      # ============================================================
      # 9. FLUTTER CLEAN
      # ============================================================
      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

      # ============================================================
      # 10. PUB GET
      # ============================================================
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # ============================================================
      # 11. FORMAT
      # ============================================================
      - name: Dart Format
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          dart format lib

      # ============================================================
      # 12. ANALYZE
      # ============================================================
      - name: Flutter Analyze
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ============================================================
      # 13. BUILD USER APK
      # ============================================================
      - name: Build USER APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING USER APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

          echo "USER APK BUILD COMPLETE."

      # ============================================================
      # 14. BUILD ADMIN APK
      # ============================================================
      - name: Build ADMIN APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

          echo "ADMIN APK BUILD COMPLETE."

      # ============================================================
      # 15. COLLECT APKs
      # ============================================================
      - name: Collect APK Files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COLLECTING APK FILES"
          echo "======================================"

          mkdir -p release

          USER_APK="build/app/outputs/flutter-apk/app-user-release.apk"
          ADMIN_APK="build/app/outputs/flutter-apk/app-admin-release.apk"

          if [ ! -f "$USER_APK" ]; then
            echo "ERROR: USER APK not found."
            echo ""
            echo "Available APK files:"
            find build \
              -type f \
              -name '*.apk' \
              -print || true
            exit 1
          fi

          if [ ! -f "$ADMIN_APK" ]; then
            echo "ERROR: ADMIN APK not found."
            echo ""
            echo "Available APK files:"
            find build \
              -type f \
              -name '*.apk' \
              -print || true
            exit 1
          fi

          cp \
            "$USER_APK" \
            release/SADEE-DIMA-OPTIMIZER-USER.apk

          cp \
            "$ADMIN_APK" \
            release/SADEE-DIMA-OPTIMIZER-ADMIN.apk

          echo ""
          echo "FINAL APK FILES:"
          ls -lh release/

      # ============================================================
      # 16. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-OPTIMIZER-APKs
          path: |
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-USER.apk
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-ADMIN.apk
          if-no-files-found: error

      # ============================================================
      # 17. FINAL SUMMARY
      # ============================================================
      - name: Final Build Summary
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       SADEE X DIMA BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "ZIP extraction : SUCCESS"
          echo "Original ZIP   : UNCHANGED"
          echo "Logo repair    : SUCCESS"
          echo "Kotlin repair  : SUCCESS"
          echo "Flutter pub    : SUCCESS"
          echo "Flutter analyze: SUCCESS"
          echo "USER APK       : SUCCESS"
          echo "ADMIN APK      : SUCCESS"
          echo ""
          echo "APKs are available in GitHub Actions Artifacts."
          echo ""
          echo "=============================================="
