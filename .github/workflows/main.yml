name: SADEE X DIMA BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build User and Admin APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version


      # ============================================================
      # FIND ZIP
      # ============================================================

      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -type f \
            -name "*.zip" \
            -not -path "./extracted_project/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "================================"
          echo "ZIP FOUND"
          echo "$ZIP_FILE"
          echo "================================"


      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf extracted_project

          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" \
            -d extracted_project

          PUBSPEC=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT DIRECTORY"
          echo "$PROJECT_DIR"
          echo "================================"


      # ============================================================
      # VERIFY PROJECT
      # ============================================================

      - name: Verify Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart

          echo "Project verification OK"


      # ============================================================
      # FIX GRADLE
      # ============================================================

      - name: Fix Gradle Versions
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER" ]; then
            sed -i \
              's/gradle-[0-9.]*-all\.zip/gradle-8.14.5-all.zip/g' \
              "$WRAPPER"
          fi

          if [ -f "android/build.gradle" ]; then

            sed -i \
              's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.11.1/g' \
              android/build.gradle || true

            sed -i \
              "s/ext.kotlin_version = ['\"][^'\"]*['\"]/ext.kotlin_version = '2.2.20'/g" \
              android/build.gradle || true

          fi

          echo "Gradle versions checked"


      # ============================================================
      # ADD NOTIFICATION PERMISSION
      # ============================================================

      - name: Fix Notification Permission
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then

            sed -i \
              '2i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' \
              "$MANIFEST"

          fi

          echo "POST_NOTIFICATIONS permission OK"


      # ============================================================
      # NATIVE NOTIFICATION + CLEANER PATCH
      # ============================================================

      - name: Fix Notifications And Cleaner
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path


          # ========================================================
          # 1. OPTIMIZER SERVICE
          # ========================================================

          optimizer = Path(
              "lib/services/optimizer_service.dart"
          )

          if not optimizer.exists():
              raise SystemExit(
                  "ERROR: optimizer_service.dart not found"
              )

          text = optimizer.read_text(
              encoding="utf-8"
          )

          if "Future<void> notifyOperation(" not in text:

              method = r'''
            Future<void> notifyOperation(
              String title,
              String message,
            ) async {
              try {
                await _channel.invokeMethod(
                  'notifyUser',
                  <String, dynamic>{
                    'title': title,
                    'text': message,
                  },
                );
              } catch (_) {}
            }

          '''

              marker = "\n  String formatBytes"

              if marker in text:

                  text = text.replace(
                      marker,
                      "\n" + method + marker,
                      1,
                  )

              else:

                  pos = text.rfind("\n}")

                  if pos < 0:
                      raise SystemExit(
                          "ERROR: OptimizerService class end not found"
                      )

                  text = (
                      text[:pos]
                      + "\n"
                      + method
                      + text[pos:]
                  )

              optimizer.write_text(
                  text,
                  encoding="utf-8"
              )


          # ========================================================
          # 2. USER HOME CLEANER OPTIONS
          # ========================================================

          user_home = Path(
              "lib/screens/user_home.dart"
          )

          if user_home.exists():

              text = user_home.read_text(
                  encoding="utf-8"
              )

              # Add extra cleaner categories
              text = text.replace(
                  "'downloads','large','old','duplicates','junk','empty'",
                  "'downloads','large','old','duplicates','junk','empty',"
                  "'thumbnails','apk','temp'"
              )

              # Add labels
              text = text.replace(
                  "'empty':'Empty Folders'}[c]??c",
                  "'empty':'Empty Folders',"
                  "'thumbnails':'Thumbnail Cache',"
                  "'apk':'APK Files',"
                  "'temp':'Temporary Files'}[c]??c"
              )

              user_home.write_text(
                  text,
                  encoding="utf-8"
              )


          # ========================================================
          # 3. MAIN ACTIVITY
          # ========================================================

          kotlin_files = list(
              Path(
                  "android/app/src/main/kotlin"
              ).rglob("MainActivity.kt")
          )

          if not kotlin_files:
              raise SystemExit(
                  "ERROR: MainActivity.kt not found"
              )

          main_activity = kotlin_files[0]

          text = main_activity.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # NOTIFICATION METHOD CHANNEL
          # ========================================================

          if '"notifyUser" ->' not in text:

              # Try common existing deleteFiles case
              patterns = [
                  (
                      '"deleteFiles" -> result.success('
                      'deleteFiles(call.argument<List<String>>("paths") '
                      '?: emptyList()))'
                  ),
                  (
                      '"cancelScan" -> {'
                  ),
              ]

              inserted = False

              for marker in patterns:

                  if marker in text:

                      if marker.startswith(
                          '"deleteFiles"'
                      ):

                          replacement = (
                              marker
                              + '\n'
                              + '                "notifyUser" -> {\n'
                              + '                    val title = '
                              + 'call.argument<String>("title") '
                              + '?: "SADEE X DIMA"\n'
                              + '                    val message = '
                              + 'call.argument<String>("text") '
                              + '?: ""\n'
                              + '                    notifyUser(title, message)\n'
                              + '                    result.success(true)\n'
                              + '                }'
                          )

                          text = text.replace(
                              marker,
                              replacement,
                              1
                          )

                          inserted = True
                          break

              if not inserted:

                  print(
                      "WARNING: Could not locate "
                      "MethodChannel insertion point"
                  )


          # ========================================================
          # ENSURE NOTIFY USER FUNCTION
          # ========================================================

          if "fun notifyUser(" not in text:

              notification_method = r'''

          private fun notifyUser(
              title: String,
              message: String
          ) {
              try {
                  val manager =
                      getSystemService(
                          android.content.Context.NOTIFICATION_SERVICE
                      ) as android.app.NotificationManager

                  val channelId = "sxd_ops"

                  if (
                      android.os.Build.VERSION.SDK_INT >=
                      android.os.Build.VERSION_CODES.O
                  ) {
                      val channel =
                          android.app.NotificationChannel(
                              channelId,
                              "SADEE X DIMA Operations",
                              android.app.NotificationManager.IMPORTANCE_LOW
                          )

                      manager.createNotificationChannel(
                          channel
                      )
                  }

                  val builder =
                      androidx.core.app.NotificationCompat.Builder(
                          this,
                          channelId
                      )
                          .setSmallIcon(
                              android.R.drawable.ic_dialog_info
                          )
                          .setContentTitle(title)
                          .setContentText(message)
                          .setStyle(
                              androidx.core.app.NotificationCompat.BigTextStyle()
                                  .bigText(message)
                          )
                          .setPriority(
                              androidx.core.app.NotificationCompat.PRIORITY_LOW
                          )
                          .setAutoCancel(true)

                  manager.notify(
                      System.currentTimeMillis().toInt(),
                      builder.build()
                  )

              } catch (e: Exception) {
                  e.printStackTrace()
              }
          }

          '''

              pos = text.rfind("\n}")

              if pos >= 0:

                  text = (
                      text[:pos]
                      + notification_method
                      + text[pos:]
                  )


          # ========================================================
          # CLEANER EXTRA MATCHERS
          # ========================================================

          old_match = (
              '"junk"->ext in setOf("tmp","temp","log","bak","old",'
              '"cache","crdownload","part","dmp")||'
              'n.endsWith(".nomedia.tmp");'
              'else->false'
          )

          new_match = (
              '"junk"->ext in setOf("tmp","temp","log","bak","old",'
              '"cache","crdownload","part","dmp")||'
              'n.endsWith(".nomedia.tmp");'
              '"thumbnails"->n.contains(".thumb")||'
              'p.contains("/.thumbnails/");'
              '"apk"->ext=="apk";'
              '"temp"->ext in setOf("tmp","temp","cache","log","bak");'
              'else->false'
          )

          if (
              '"thumbnails"->n.contains(".thumb")'
              not in text
          ):

              if old_match in text:

                  text = text.replace(
                      old_match,
                      new_match,
                      1
                  )

          main_activity.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Notification + cleaner patch completed"
          )

          PY


      # ============================================================
      # CHECK NOTIFICATION BRIDGE
      # ============================================================

      - name: Verify Notification Bridge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -Fq \
            "notifyOperation" \
            lib/services/optimizer_service.dart

          grep -Fq \
            "notifyUser" \
            android/app/src/main/kotlin/*/*/*/MainActivity.kt \
            2>/dev/null || true

          echo "Notification bridge check completed"


      # ============================================================
      # PNG REPAIR
      # ============================================================

      - name: Repair PNG Files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 -m pip install --quiet pillow

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path(
              "android/app/src/main/res"
          )

          if not root.exists():
              print(
                  "Android resources directory not found"
              )
              raise SystemExit(0)

          for path in root.rglob("*.png"):

              try:

                  image = Image.open(path)
                  image.load()

                  image.convert("RGBA").save(
                      path,
                      format="PNG"
                  )

                  print(
                      "PNG repaired:",
                      path
                  )

              except Exception as error:

                  print(
                      "PNG skipped:",
                      path,
                      error
                  )
          PY


      # ============================================================
      # CHECK FLAVORS
      # ============================================================

      - name: Check Product Flavors
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if ! grep -Rqs \
            "productFlavors" \
            android/app; then

            echo "ERROR: productFlavors not found"
            exit 1

          fi

          echo "Product flavors OK"


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter clean


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter pub get


      # ============================================================
      # FORMAT
      # ============================================================

      - name: Dart Format
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          dart format lib


      # ============================================================
      # VERIFY NOTIFY OPERATION
      # ============================================================

      - name: Verify OptimizerService
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -Fq \
            "Future<void> notifyOperation(" \
            lib/services/optimizer_service.dart

          echo "notifyOperation() verified"


      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Flutter Analyze
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings


      # ============================================================
      # BUILD USER
      # ============================================================

      - name: Build User APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart


      # ============================================================
      # BUILD ADMIN
      # ============================================================

      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart


      # ============================================================
      # COLLECT APK
      # ============================================================

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p apk_output

          find \
            "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -exec cp {} apk_output/ \;

          echo "================================"
          echo "BUILT APK FILES"
          echo "================================"

          ls -lh apk_output


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APKs
          path: apk_output/*.apk
          if-no-files-found: error
