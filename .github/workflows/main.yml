name: Build SADEE-DIMA APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print | sort | tail -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Flutter project or ZIP found."
              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"

            rm -rf extracted
            mkdir -p extracted
            unzip -q -o "$ZIP_FILE" -d extracted

            PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit || true)"

            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: pubspec.yaml not found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Fix Android toolchain
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then

            rm -rf android

            flutter create \
              --platforms=android \
              --project-name=sadee_x_dima \
              .
          fi

          # Gradle
          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.5-bin.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

          # Android Gradle Plugin + Kotlin
          if [ -f android/settings.gradle ]; then

            sed -i \
              's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' \
              android/settings.gradle

            sed -i \
              's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' \
              android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' \
              android/settings.gradle.kts

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' \
              android/settings.gradle.kts
          fi

          echo "=== Android files ==="
          test -f android/app/build.gradle || \
            test -f android/app/build.gradle.kts

          test -f android/settings.gradle || \
            test -f android/settings.gradle.kts

          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos

      # =========================
      # USER APK
      # =========================

      - name: Build User APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

      - name: Save User APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            "${PROJECT_DIR}/build/app/outputs/flutter-apk/app-user-release.apk" \
            "release/SADEE-DIMA-USER.apk"

          test -f release/SADEE-DIMA-USER.apk

      # =========================
      # ADMIN APK
      # =========================

      - name: Build Admin APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

      - name: Save Admin APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            "${PROJECT_DIR}/build/app/outputs/flutter-apk/app-admin-release.apk" \
            "release/SADEE-DIMA-ADMIN.apk"

          test -f release/SADEE-DIMA-ADMIN.apk

      # =========================
      # VERIFY
      # =========================

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FINAL APKs ==="
          ls -lh release/

          test -f release/SADEE-DIMA-USER.apk
          test -f release/SADEE-DIMA-ADMIN.apk

          echo "USER APK OK"
          echo "ADMIN APK OK"

      # =========================
      # UPLOAD
      # =========================

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-APKs
          path: release/*.apk
          if-no-files-found: error
