      title: 'HOME',
      icon: Icons.home,
      items: [
        'Optimizer Dashboard',
        'Gaming Mode',
        'Performance',
        'SADEE X DIMA LAUNCH',
      ],
    ),
    FeaturePage(
      title: 'OPTIMIZER',
      icon: Icons.bolt,
      items: [
        'RAM Optimization',
        'Performance Mode',
        'Background Apps',
      ],
    ),
    FeaturePage(
      title: 'GAMING',
      icon: Icons.sports_esports,
      items: [
        'Game Mode',
        'Game Launcher',
        'Gaming Settings',
      ],
    ),
    FeaturePage(
      title: 'PERFORMANCE',
      icon: Icons.speed,
      items: [
        'CPU Status',
        'RAM Status',
        'Battery Status',
        'Storage Status',
      ],
    ),
    FeaturePage(
      title: 'SETTINGS',
      icon: Icons.settings,
      items: [
        'License',
        'App Version',
        'About',
      ],
    ),
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text(
          'SADEE X DIMA',
          style: TextStyle(
            fontWeight: FontWeight.w900,
          ),
        ),
      ),
      body: pages[selected],
      bottomNavigationBar: NavigationBar(
        selectedIndex: selected,
        onDestinationSelected: (value) {
          setState(() {
            selected = value;
          });
        },
        destinations: const [
          NavigationDestination(
            icon: Icon(Icons.home),
            label: 'Home',
          ),
          NavigationDestination(
            icon: Icon(Icons.bolt),
            label: 'Optimize',
          ),
          NavigationDestination(
            icon: Icon(Icons.sports_esports),
            label: 'Gaming',
          ),
          NavigationDestination(
            icon: Icon(Icons.speed),
            label: 'Performance',
          ),
          NavigationDestination(
            icon: Icon(Icons.settings),
            label: 'Settings',
          ),
        ],
      ),
    );
  }
}

class FeaturePage extends StatelessWidget {
  final String title;
  final IconData icon;
  final List<String> items;

  const FeaturePage({
    super.key,
    required this.title,
    required this.icon,
    required this.items,
  });

  @override
  Widget build(BuildContext context) {
    return ListView(
      padding: const EdgeInsets.all(18),
      children: [
        Row(
          children: [
            Icon(
              icon,
              color: accent,
              size: 30,
            ),
            const SizedBox(width: 10),
            Text(
              title,
              style: const TextStyle(
                fontSize: 26,
                fontWeight: FontWeight.w900,
              ),
            ),
          ],
        ),
        const SizedBox(height: 18),
        ...items.map(
          (item) => Card(
            color: cardColor,
            child: ListTile(
              leading: const Icon(
                Icons.check_circle_outline,
                color: accent,
              ),
              title: Text(item),
              trailing: const Icon(Icons.chevron_right),
              onTap: () {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text('$item selected'),
                  ),
                );
              },
            ),
          ),
        ),
      ],
    );
  }
}
DART

      - name: Build User APK
        working-directory: user_build
        run: |
          flutter pub get
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Create Admin Project
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_admin \
            admin_build

      - name: Copy Admin
        run: |
          rm -rf admin_build/lib
          rm -rf admin_build/test

          cp -r "$ADMIN_DIR/lib" admin_build/lib
          cp "$ADMIN_DIR/pubspec.yaml" admin_build/pubspec.yaml

      - name: Build Admin APK
        working-directory: admin_build
        run: |
          flutter pub get
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
