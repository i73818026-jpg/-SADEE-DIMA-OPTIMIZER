name: SADEE X DIMA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found"
            find . -maxdepth 3 -type f ! -path "./.git/*" | sort
            exit 1
          fi

          echo "✅ ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "✅ ZIP extracted"

      - name: Find Projects
        shell: bash
        run: |
          set -e

          USER_DIR=$(find extracted -type f -path "*/user/pubspec.yaml" -exec dirname {} \; | head -n 1)
          ADMIN_DIR=$(find extracted -type f -path "*/admin/pubspec.yaml" -exec dirname {} \; | head -n 1)

          if [ -z "$USER_DIR" ]; then
            echo "❌ user project not found"
            exit 1
          fi

          if [ -z "$ADMIN_DIR" ]; then
            echo "❌ admin project not found"
            exit 1
          fi

          echo "USER_DIR=$USER_DIR" >> "$GITHUB_ENV"
          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ==================================================
      # USER
      # ==================================================

      - name: Create User Project
        run: |
          flutter create \
            --org com.sadee.xdima \
            --project-name sadee_optimizer_user \
            user_build

      - name: Copy User Config
        run: |
          rm -rf user_build/test

          cp "$USER_DIR/pubspec.yaml" user_build/pubspec.yaml
          cp "$USER_DIR/lib/config.dart" user_build/lib/config.dart

      - name: Create Clean User Main
        shell: bash
        run: |
          cat > user_build/lib/main.dart <<'DART'
import 'package:flutter/material.dart';
import 'package:supabase_flutter/supabase_flutter.dart';
import 'package:url_launcher/url_launcher.dart';
import 'config.dart';

const bg = Color(0xFF070A10);
const card = Color(0xFF111722);
const accent = Color(0xFF00E5FF);

Future<void> main() async {
  WidgetsFlutterBinding.ensureInitialized();

  await Supabase.initialize(
    url: supabaseUrl,
    publishableKey: supabaseAnonKey,
  );

  runApp(const SadeeApp());
}

class SadeeApp extends StatelessWidget {
  const SadeeApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'SADEE X DIMA Optimizer',
      theme: ThemeData(
        brightness: Brightness.dark,
        scaffoldBackgroundColor: bg,
        colorScheme: ColorScheme.fromSeed(
          seedColor: accent,
          brightness: Brightness.dark,
        ),
        useMaterial3: true,
      ),
      home: const LoginPage(),
    );
  }
}

class LoginPage extends StatefulWidget {
  const LoginPage({super.key});

  @override
  State<LoginPage> createState() => _LoginPageState();
}

class _LoginPageState extends State<LoginPage> {
  final controller = TextEditingController();
  bool loading = false;

  Future<void> login() async {
    final code = controller.text.trim().toUpperCase();

    if (code.isEmpty) {
      message('Enter your license key.');
      return;
    }

    setState(() {
      loading = true;
    });

    try {
      final row = await Supabase.instance.client
          .from('license_keys')
          .select()
          .eq('key_code', code)
          .maybeSingle();

      if (row == null) {
        message('License key not found.');
        return;
      }

      final status =
          (row['status'] ?? 'UNUSED').toString().toUpperCase();

      final expires = row['expires_at'] == null
          ? null
          : DateTime.tryParse(row['expires_at'].toString());

      final expired =
          expires != null && expires.isBefore(DateTime.now().toUtc());

      if (status == 'PAUSED') {
        message('This license is paused.');
        return;
      }

      if (status == 'EXPIRED' || expired) {
        message('This license has expired.');
        return;
      }

      if (status == 'UNUSED') {
        final days = (row['duration_days'] as num).toInt();

        await Supabase.instance.client
            .from('license_keys')
            .update({
          'status': 'ACTIVE',
          'activated_at': DateTime.now().toUtc().toIso8601String(),
          'expires_at': days == -1
              ? null
              : DateTime.now()
                  .toUtc()
                  .add(Duration(days: days))
                  .toIso8601String(),
        }).eq('key_code', code);
      }

      if (!mounted) return;

      Navigator.pushReplacement(
        context,
        MaterialPageRoute(
          builder: (_) => DashboardPage(keyCode: code),
        ),
      );
    } catch (_) {
      message('Connection error. Check internet and Supabase.');
    } finally {
      if (mounted) {
        setState(() {
          loading = false;
        });
      }
    }
  }

  void message(String text) {
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(content: Text(text)),
    );
  }

  Future<void> buy(String plan, String price) async {
    final text = Uri.encodeComponent(
      'Hello SADEE X DIMA, I want to order $plan license ($price).',
    );

    final uri = Uri.parse(
      'https://wa.me/$orderWhatsApp?text=$text',
    );

    if (await canLaunchUrl(uri)) {
      await launchUrl(
        uri,
        mode: LaunchMode.externalApplication,
      );
    }
  }

  Widget priceCard(
    String title,
    String price,
    String subtitle,
  ) {
    return Card(
      color: card,
      child: ListTile(
        leading: const Icon(
          Icons.vpn_key,
          color: accent,
        ),
        title: Text(
          title,
          style: const TextStyle(
            fontWeight: FontWeight.bold,
          ),
        ),
        subtitle: Text(subtitle),
        trailing: TextButton(
          onPressed: () => buy(title, price),
          child: Text(
            'BUY\n$price',
            textAlign: TextAlign.center,
          ),
        ),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: SafeArea(
        child: ListView(
          padding: const EdgeInsets.all(20),
          children: [
            const SizedBox(height: 35),
            const Icon(
              Icons.bolt,
              color: accent,
              size: 70,
            ),
            const SizedBox(height: 10),
            const Text(
              '𝕤𝕒𝕕𝕖𝕖 𝕏 𝕕𝕚𝕞𝕒',
              textAlign: TextAlign.center,
              style: TextStyle(
                fontSize: 28,
                fontWeight: FontWeight.w900,
              ),
            ),
            const Text(
              'OPTIMIZER',
              textAlign: TextAlign.center,
              style: TextStyle(
                color: accent,
                letterSpacing: 5,
                fontWeight: FontWeight.bold,
              ),
            ),
            const SizedBox(height: 35),
            TextField(
              controller: controller,
              textCapitalization: TextCapitalization.characters,
              decoration: InputDecoration(
                prefixIcon: const Icon(
                  Icons.key,
                  color: accent,
                ),
                hintText: 'License / Access Key',
                filled: true,
                fillColor: card,
                border: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(16),
                  borderSide: BorderSide.none,
                ),
              ),
            ),
            const SizedBox(height: 12),
            SizedBox(
              height: 52,
              child: FilledButton(
                onPressed: loading ? null : login,
                child: loading
                    ? const CircularProgressIndicator()
                    : const Text(
                        'LOGIN',
                        style: TextStyle(
                          fontWeight: FontWeight.w900,
                        ),
                      ),
              ),
            ),
            const SizedBox(height: 25),
            const Text(
              'KEY PRICES',
              style: TextStyle(
                color: accent,
                fontWeight: FontWeight.w900,
                letterSpacing: 2,
              ),
            ),
            const SizedBox(height: 8),
            priceCard(
              '7 DAYS',
              'Rs. 500',
              '7 Day License',
            ),
            priceCard(
              '1 MONTH',
              'Rs. 1,000',
              '30 Day License',
            ),
            priceCard(
              'LIFETIME',
              'Rs. 2,200',
              'Lifetime License',
            ),
          ],
        ),
      ),
    );
  }
}

class DashboardPage extends StatefulWidget {
