name: SADEE X DIMA REAL USER + ADMIN

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Verify project
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart
          test -f assets/sadee_logo.png

      - name: Verify logo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("assets/sadee_logo.png")
          sig = p.read_bytes()[:8]
          expected = b"\x89PNG\r\n\x1a\n"
          if sig != expected:
              raise SystemExit("assets/sadee_logo.png is not a valid PNG")
          print("Logo PNG: OK")
          PY

      - name: Flutter clean
        run: flutter clean

      - name: Pub get
        run: flutter pub get

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build user APK
        run: |
          flutter build apk --release \
            --flavor user \
            -t lib/main_user.dart

      - name: Build admin APK
        run: |
          flutter build apk --release \
            --flavor admin \
            -t lib/main_admin.dart

      - name: List APKs
        run: |
          find build/app/outputs/flutter-apk -type f -name "*.apk" -print

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-real-user-admin-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

