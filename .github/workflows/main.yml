name: SADEE X DIMA Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -type f -iname '*.zip' ! -path './.git/*' | head -1)
          test -n "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Find projects
        run: |
          USER=$(find extracted -type f -path '*/user/pubspec.yaml' -exec dirname {} \; | head -1)
          ADMIN=$(find extracted -type f -path '*/admin/pubspec.yaml' -exec dirname {} \; | head -1)

          test -n "$USER"
          test -n "$ADMIN"

          echo "USER=$USER" >> "$GITHUB_ENV"
          echo "ADMIN=$ADMIN" >> "$GITHUB_ENV"

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - name: User project
        run: |
          flutter create --org com.sadee.xdima --project-name sadee_optimizer_user user_build
          rm -rf user_build/lib
          rm -rf user_build/test
          cp -r "$USER/lib" user_build/lib
          cp "$USER/pubspec.yaml" user_build/pubspec.yaml

      - name: User build
        working-directory: user_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Admin project
        run: |
          flutter create --org com.sadee.xdima --project-name sadee_optimizer_admin admin_build
          rm -rf admin_build/lib
          rm -rf admin_build/test
          cp -r "$ADMIN/lib" admin_build/lib
          cp "$ADMIN/pubspec.yaml" admin_build/pubspec.yaml

      - name: Admin build
        working-directory: admin_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: User APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-user-apk
          path: user_build/build/app/outputs/flutter-apk/app-release.apk

      - name: Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: sadee-x-dima-admin-apk
          path: admin_build/build/app/outputs/flutter-apk/app-release.apk
