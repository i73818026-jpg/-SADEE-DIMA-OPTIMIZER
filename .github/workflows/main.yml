name: Build Sadee X Dima Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            -print | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted_project"
          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          PUBSPEC=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name "pubspec.yaml" \
            -print | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT: $PROJECT_DIR"

      - name: Verify Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart
          test -f android/app/build.gradle

          echo "Project verified."

      - name: Fix PNG Resource
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          LOGO="android/app/src/main/res/drawable-nodpi/sadee_logo.png"

          if [ -f "$LOGO" ]; then
            echo "Checking $LOGO"

            if ! file "$LOGO" | grep -qi "PNG"; then
              echo "Invalid PNG detected."

              rm -f "$LOGO"

              python3 - "$LOGO" <<'PY'
from PIL import Image
import sys

path = sys.argv[1]

img = Image.new("RGBA", (1, 1), (0, 0, 0, 0))
img.save(path, "PNG")

print("Valid PNG created:", path)
PY

              echo "Temporary PNG replacement created."
            else
              echo "PNG file detected."
            fi
          else
            echo "Logo file not found. Continuing."
          fi

      - name: Patch Android Toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f android/settings.gradle ]; then
            sed -i \
              's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' \
              android/settings.gradle || true

            sed -i \
              's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' \
              android/settings.gradle || true
          fi

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Flutter Analyze
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Verify Flavors
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          BUILD_FILE="android/app/build.gradle"

          if ! grep -Fq "productFlavors" "$BUILD_FILE"; then
            echo "ERROR: productFlavors not found."
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*user[[:space:]]*\{' "$BUILD_FILE"; then
            echo "ERROR: user flavor not found."
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*admin[[:space:]]*\{' "$BUILD_FILE"; then
            echo "ERROR: admin flavor not found."
            exit 1
          fi

          echo "User/Admin flavors OK."

      - name: Build User APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING USER APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

      - name: Build Admin APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-user-release.apk \
            release/SADEE-DIMA-OPTIMIZER-USER.apk

          cp \
            build/app/outputs/flutter-apk/app-admin-release.apk \
            release/SADEE-DIMA-OPTIMIZER-ADMIN.apk

          ls -lh release/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-OPTIMIZER-APKs
          path: |
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-USER.apk
            ${{ env.PROJECT_DIR }}/release/SADEE-DIMA-OPTIMIZER-ADMIN.apk
          if-no-files-found: error
