name: Build SADEE X DIMA Optimizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          echo "ZIP files:"
          find . -maxdepth 3 -type f \( -name "*.zip" -o -name "*.ZIP" \)

      - name: Extract ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 3 -type f \( -name "*.zip" -o -name "*.ZIP" \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found"
            exit 1
          fi

          echo "📦 Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Flutter project
        run: |
          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "✅ Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Java version
        run: java -version

      - name: Upgrade Android Gradle Plugin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/com.android.application" version "[^"]*"/com.android.application" version "8.9.1"/g' android/settings.gradle
            sed -i 's/com.android.library" version "[^"]*"/com.android.library" version "8.9.1"/g' android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.9.1"/g' android/settings.gradle.kts
            sed -i 's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.9.1"/g' android/settings.gradle.kts
          fi

      - name: Update Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.11.1-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's/gradle-[0-9.]*-bin.zip/gradle-8.11.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Fix Java and Kotlin JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              # Java 17
              text = text.replace(
                  "sourceCompatibility JavaVersion.VERSION_1_8",
                  "sourceCompatibility JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "targetCompatibility JavaVersion.VERSION_1_8",
                  "targetCompatibility JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              # Kotlin 17
              text = text.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              path.write_text(text)
          PY

      - name: Force JVM 17 in Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p android/gradle

          cat >> android/gradle.properties <<'EOF'

          org.gradle.java.home=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.*/x64
          kotlin.jvm.target.validation.mode=warning
          EOF

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze || true

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter pub get again
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
