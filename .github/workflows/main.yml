    );
  }
}

class FeaturePage extends StatelessWidget {
  final String title;
  final IconData icon;
  final List<String> items;

  const FeaturePage({
    super.key,
    required this.title,
    required this.icon,
    required this.items,
  });

  @override
  Widget build(BuildContext context) {
    return ListView(
      padding: const EdgeInsets.all(16),
      children: [
        Row(
          children: [
            Icon(
              icon,
              color: Colors.cyan,
              size: 30,
            ),
            const SizedBox(width: 10),
            Text(
              title,
              style: const TextStyle(
                fontSize: 24,
                fontWeight: FontWeight.bold,
              ),
            ),
          ],
        ),

        const SizedBox(height: 14),

        ...items.map(
          (item) => Card(
            child: ListTile(
              leading: const Icon(
                Icons.check_circle,
                color: Colors.cyan,
              ),
              title: Text(item),
              trailing: const Icon(
                Icons.chevron_right,
              ),
            ),
          ),
        ),
      ],
    );
  }
}
