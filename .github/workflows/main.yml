name: SADEE X DIMA BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -type f -name "*.zip" \
            -not -path "./extracted_project/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using: $ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted_project
          mkdir extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          PUBSPEC=$(find extracted_project \
            -type f \
            -name pubspec.yaml \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify Project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main_user.dart
          test -f lib/main_admin.dart

          echo "Project OK"

      - name: Fix Gradle Versions
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          sed -i \
            's/gradle-[0-9.]*-all\.zip/gradle-8.14.5-all.zip/g' \
            android/gradle/wrapper/gradle-wrapper.properties || true

          if [ -f android/build.gradle ]; then
            sed -i \
              's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.11.1/g' \
              android/build.gradle || true

            sed -i \
              "s/ext.kotlin_version = ['\"][^'\"]*['\"]/ext.kotlin_version = '2.2.20'/g" \
              android/build.gradle || true
          fi

          if [ -f android/settings.gradle ]; then
            sed -i \
              's/\(com.android.application.*version[[:space:]]*["'\'']\)[0-9.]*\(["'\'']\)/\18.11.1\2/g' \
              android/settings.gradle || true

            sed -i \
              's/\(org.jetbrains.kotlin.android.*version[[:space:]]*["'\'']\)[0-9.]*\(["'\'']\)/\12.2.20\2/g' \
              android/settings.gradle || true
          fi

          echo "Gradle versions checked"

      - name: Add Notification Permission
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i \
                '2i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' \
                "$MANIFEST"
            fi
          fi

          echo "Notification permission checked"

      - name: Repair PNG
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          python3 -m pip install --quiet pillow

          python3 -c '
          from pathlib import Path
          from PIL import Image

          root = Path("android/app/src/main/res")

          if root.exists():
              for p in root.rglob("*.png"):
                  try:
                      im = Image.open(p)
                      im.load()
                      im.convert("RGBA").save(p, "PNG")
                      print("Fixed:", p)
                  except Exception as e:
                      print("Skip:", p, e)
          '

      - name: Flutter Clean
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter clean

      - name: Flutter Pub Get
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Dart Format
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          dart format lib

      - name: Analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build User APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --flavor user \
            -t lib/main_user.dart

      - name: Build Admin APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --flavor admin \
            -t lib/main_admin.dart

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p apk_output

          find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -exec cp {} apk_output/ \;

          ls -lh apk_output

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APKs
          path: apk_output/*.apk
          if-no-files-found: error
